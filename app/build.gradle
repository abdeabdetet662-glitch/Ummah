plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// ═══ قراءة local.properties ═══
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localProps.load(new FileInputStream(localFile))
}
def getLocalProp = { String key, String defaultVal = "" ->
    return localProps.getProperty(key) ?: defaultVal
}


android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.ummah.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.ummah.app"
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName "5.2"
    }

    signingConfigs {
        release {
            storeFile file(getLocalProp("KEYSTORE_FILE", "../ummah-release.keystore"))
            storePassword getLocalProp("KEYSTORE_PASSWORD", System.getenv("KEYSTORE_PASSWORD") ?: "")
            keyAlias "ummah"
            keyPassword getLocalProp("KEY_PASSWORD", System.getenv("KEY_PASSWORD") ?: "")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
