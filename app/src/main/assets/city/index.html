<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مدينة أُمّة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
  canvas { display: block; touch-action: none; }

  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #D4AF37; font-size: 15px; text-align: center;
    z-index: 100; background: rgba(10,5,16,0.92);
    padding: 30px 40px; border-radius: 20px;
    border: 2px solid #D4AF37;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2);
    border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #hud {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 14px 20px 24px;
    background: linear-gradient(to top, rgba(10,5,16,0.95), rgba(10,5,16,0));
    color: #D4AF37; font-size: 13px; z-index: 50;
    display: flex; justify-content: center; align-items: center; gap: 12px;
    pointer-events: none;
  }
  #hud .icon { font-size: 18px; }

  #info {
    position: absolute; top: 16px; right: 16px;
    background: rgba(10,5,16,0.85); color: #D4AF37;
    padding: 10px 16px; border-radius: 12px;
    font-size: 12px; z-index: 50;
    border: 1px solid rgba(212,175,55,0.4);
    backdrop-filter: blur(10px);
  }
  #info .num { color: #FFD700; font-weight: bold; font-size: 14px; }

  #plotPanel {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    display: none; align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  #plotPanel.show { display: flex; }
  #plotPanel .panel {
    width: 100%; background: #1A0F2E;
    border-top-left-radius: 24px; border-top-right-radius: 24px;
    border-top: 2px solid #D4AF37;
    padding: 24px 20px 40px;
    animation: slideUp 0.3s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #plotPanel h3 { color: #D4AF37; font-size: 20px; margin-bottom: 6px; }
  #plotPanel .coords { color: #9CA3AF; font-size: 12px; margin-bottom: 16px; }
  #plotPanel .info-row { color: #F5F5F5; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(212,175,55,0.15); }
  #plotPanel .info-row:last-of-type { border-bottom: none; }
  #plotPanel .info-row b { color: #D4AF37; }
  #plotPanel .btns { display: flex; gap: 10px; margin-top: 20px; }
  #plotPanel button {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer;
  }
  #plotPanel .btn-buy { background: linear-gradient(135deg, #FFD700, #D4AF37); color: #0A0510; }
  #plotPanel .btn-build { background: linear-gradient(135deg, #9333EA, #6B21A8); color: #FFF; }
  #plotPanel .btn-close { background: #2A1535; color: #F5F5F5; }
  #plotPanel .price { color: #FFD700; font-size: 24px; font-weight: bold; margin: 12px 0; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>جاري تحميل المدينة...</div>
</div>

<div id="info">
  <span class="icon">🏙️</span>
  قطع: <span class="num" id="plotCount">0</span> •
  مبانٍ: <span class="num" id="buildingCount">0</span>
</div>

<div id="plotPanel">
  <div class="panel">
    <h3 id="pTitle">📍 قطعة أرض</h3>
    <div class="coords" id="pCoords">(0, 0)</div>
    <div id="pContent"></div>
    <div class="btns">
      <button class="btn-close" onclick="closePanel()">إغلاق</button>
    </div>
  </div>
</div>

<div id="hud">
  <span class="icon">👆</span>
  <span>اسحب للتدوير • قرّب بإصبعين • اضغط قطعة للتفاعل</span>
</div>

<script src="../avatar/libs/three.min.js"></script>
<script src="../avatar/libs/OrbitControls.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  إعدادات عامة
// ═══════════════════════════════════════════════════════════

const GRID = 16;                 // 16×16 = 256 قطعة
const TILE = 22;                 // كل قطعة 22 وحدة
const WORLD_SIZE = GRID * TILE;  // إجمالي حجم العالم

// ═══════════════════════════════════════════════════════════
//  Scene + Camera + Renderer
// ═══════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5BA3D0);
scene.fog = new THREE.Fog(0xB8D9F0, 700, 1800);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 1, 3000
);
camera.position.set(160, 140, 160);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
// renderer.toneMapping = THREE.ACESFilmicToneMapping;
// renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 80;
controls.maxDistance = 800;
controls.maxPolarAngle = Math.PI / 2.3;
controls.target.set(0, 0, 0);
controls.update();

// ═══════════════════════════════════════════════════════════
//  الإضاءة
// ═══════════════════════════════════════════════════════════

const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xB8D9F0, 0x4A7C3F, 0.35);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFE8B0, 1.2);
sun.position.set(250, 400, 200);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 1200;
sun.shadow.camera.left = -400;
sun.shadow.camera.right = 400;
sun.shadow.camera.top = 400;
sun.shadow.camera.bottom = -400;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ═══════════════════════════════════════════════════════════
//  السماء مع تدرج لوني
// ═══════════════════════════════════════════════════════════

const skyGeo = new THREE.SphereGeometry(2000, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x1E4BA8) },
    bottomColor: { value: new THREE.Color(0x9AC8E8) },
    offset: { value: 200 },
    exponent: { value: 0.7 }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
      float f = max(pow(max(h, 0.0), exponent), 0.0);
      gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ═══════════════════════════════════════════════════════════
//  الأرض (عشب)
// ═══════════════════════════════════════════════════════════

const groundMat = new THREE.MeshLambertMaterial({ color: 0x5A9B4A });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// أرضية المدينة (مربعة)
const cityGroundMat = new THREE.MeshLambertMaterial({ color: 0x68B058 });
const cityGround = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE + 40, WORLD_SIZE + 40), cityGroundMat);
cityGround.rotation.x = -Math.PI / 2;
cityGround.position.y = 0.02;
cityGround.receiveShadow = true;
scene.add(cityGround);

// ═══════════════════════════════════════════════════════════
//  الطرق
// ═══════════════════════════════════════════════════════════

const roadMat = new THREE.MeshLambertMaterial({ color: 0x2A2A2A });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xA8A29A });
const lineMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });

function makeRoad(cx, cz, w, d, horizontal) {
  // الرصيف (أوسع)
  const sidewalk = new THREE.Mesh(
    new THREE.BoxGeometry(w + 6, 0.6, d + 6),
    sidewalkMat
  );
  sidewalk.position.set(cx, 0.3, cz);
  sidewalk.receiveShadow = true;
  scene.add(sidewalk);

  // الطريق
  const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), roadMat);
  road.position.set(cx, 0.4, cz);
  road.receiveShadow = true;
  scene.add(road);

  // الخط الأصفر في الوسط (متقطع)
  const lineCount = Math.floor((horizontal ? w : d) / 8);
  for (let i = 0; i < lineCount; i += 2) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(horizontal ? 4 : 0.4, 0.1, horizontal ? 0.4 : 4),
      lineMat
    );
    const off = -((horizontal ? w : d) / 2) + 4 + i * 8;
    line.position.set(
      horizontal ? cx + off : cx,
      0.85,
      horizontal ? cz : cz + off
    );
    scene.add(line);
  }
}

const ROAD_W = 14;
const HALF = WORLD_SIZE / 2;

// 3 طرق أفقية + 3 عمودية
for (let i = -1; i <= 1; i++) {
  const pos = i * (WORLD_SIZE / 3);
  makeRoad(0, pos, WORLD_SIZE + 60, ROAD_W, true);
  makeRoad(pos, 0, ROAD_W, WORLD_SIZE + 60, false);
}

// ساحة مركزية (plaza)
const plazaMat = new THREE.MeshLambertMaterial({ color: 0xE8DCC8 });
const plaza = new THREE.Mesh(new THREE.BoxGeometry(TILE * 3, 0.5, TILE * 3), plazaMat);
plaza.position.y = 0.25;
plaza.receiveShadow = true;
scene.add(plaza);

// نمط في الساحة (فسيفساء)
const mosaicMat = new THREE.MeshLambertMaterial({ color: 0xD4AF37 });
const mosaicR = new THREE.Mesh(new THREE.CylinderGeometry(TILE * 0.9, TILE * 0.9, 0.55, 24), mosaicMat);
mosaicR.position.y = 0.26;
scene.add(mosaicR);

const mosaicIn = new THREE.Mesh(new THREE.CylinderGeometry(TILE * 0.7, TILE * 0.7, 0.56, 24), plazaMat);
mosaicIn.position.y = 0.27;
scene.add(mosaicIn);

// ═══════════════════════════════════════════════════════════
//  النافورة
// ═══════════════════════════════════════════════════════════

function makeFountain() {
  const g = new THREE.Group();

  // القاعدة
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(8, 8, 1, 24),
    new THREE.MeshLambertMaterial({ color: 0xE8DCC8 })
  );
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  // حوض المياه
  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(7, 7, 0.6, 24),
    new THREE.MeshLambertMaterial({ color: 0x4FC3F7, transparent: true, opacity: 0.85 })
  );
  water.position.y = 0.7;
  g.add(water);

  // العمود
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.8, 0.8, 3, 12),
    new THREE.MeshLambertMaterial({ color: 0xE8DCC8 })
  );
  pillar.position.y = 2;
  pillar.castShadow = true;
  g.add(pillar);

  // الكرة العلوية
  const top = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 16, 12),
    new THREE.MeshLambertMaterial({ color: 0xD4AF37 })
  );
  top.position.y = 4;
  top.castShadow = true;
  g.add(top);

  g.position.set(0, 0.5, 0);
  return g;
}
scene.add(makeFountain());

// ═══════════════════════════════════════════════════════════
//  المباني — 10 أنواع
// ═══════════════════════════════════════════════════════════

const BUILDING_MATERIALS = {
  wall: {
    white: new THREE.MeshLambertMaterial({ color: 0xD8D4C8 }),
    beige: new THREE.MeshLambertMaterial({ color: 0xC4B898 }),
    cream: new THREE.MeshLambertMaterial({ color: 0xE8D8A8 }),
    brick: new THREE.MeshLambertMaterial({ color: 0xA0503A }),
    sand: new THREE.MeshLambertMaterial({ color: 0xD8B888 }),
    tan: new THREE.MeshLambertMaterial({ color: 0xB89068 }),
    olive: new THREE.MeshLambertMaterial({ color: 0xA8A878 }),
    blue: new THREE.MeshLambertMaterial({ color: 0x88A8C8 }),
    mint: new THREE.MeshLambertMaterial({ color: 0xA8C8B8 })
  },
  roof: {
    red: new THREE.MeshLambertMaterial({ color: 0x8B3A2A }),
    gray: new THREE.MeshLambertMaterial({ color: 0x5A5A5A }),
    brown: new THREE.MeshLambertMaterial({ color: 0x6B3A28 }),
    gold: new THREE.MeshLambertMaterial({ color: 0xD4AF37 })
  },
  window: new THREE.MeshLambertMaterial({
    color: 0x87CEEB, emissive: 0x2A4A6A, emissiveIntensity: 0.4
  }),
  door: new THREE.MeshLambertMaterial({ color: 0x5A3A28 })
};

function addWindows(parent, w, h, wallDepth, floors) {
  const cols = Math.max(2, Math.floor(w / 2.5));
  const rows = floors;
  const windowW = 0.9;
  const windowH = 1.1;
  const startX = -w / 2 + 1.5;

  for (let f = 0; f < rows; f++) {
    const y = 1.5 + f * 3;
    for (let c = 0; c < cols; c++) {
      const x = startX + c * ((w - 3) / cols) + 1;

      // أمامي
      const win1 = new THREE.Mesh(
        new THREE.BoxGeometry(windowW, windowH, 0.1),
        BUILDING_MATERIALS.window
      );
      win1.position.set(x, y, wallDepth / 2 + 0.06);
      parent.add(win1);

      // خلفي
      const win2 = win1.clone();
      win2.position.z = -wallDepth / 2 - 0.06;
      parent.add(win2);
    }
  }

  // النوافذ الجانبية
  const sideCols = Math.max(2, Math.floor(wallDepth / 2.5));
  for (let f = 0; f < rows; f++) {
    const y = 1.5 + f * 3;
    for (let c = 0; c < sideCols; c++) {
      const z = -wallDepth / 2 + 1.5 + c * ((wallDepth - 3) / sideCols) + 1;

      const win1 = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, windowH, windowW),
        BUILDING_MATERIALS.window
      );
      win1.position.set(w / 2 + 0.06, y, z);
      parent.add(win1);

      const win2 = win1.clone();
      win2.position.x = -w / 2 - 0.06;
      parent.add(win2);
    }
  }
}

function makeBuilding(type, level) {
  const g = new THREE.Group();
  const wallMat = BUILDING_MATERIALS.wall[
    ['white','beige','cream','brick','sand','tan','olive','blue','mint'][Math.floor(Math.random()*9)]
  ];

  if (type === 'cottage') {
    const w = 10, h = 4, d = 10;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    // سقف مثلث
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(w * 0.8, 3, 4),
      BUILDING_MATERIALS.roof.red
    );
    roof.position.y = h + 1.5;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    g.add(roof);

    addWindows(g, w, h, d, 1);

    // باب
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 0.2), BUILDING_MATERIALS.door);
    door.position.set(0, 1.25, d / 2 + 0.1);
    g.add(door);
  }
  else if (type === 'house') {
    const w = 12, h = 8, d = 12;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(w * 0.75, 4, 4),
      BUILDING_MATERIALS.roof.brown
    );
    roof.position.y = h + 2;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    g.add(roof);

    addWindows(g, w, h, d, 2);

    const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3, 0.2), BUILDING_MATERIALS.door);
    door.position.set(0, 1.5, d / 2 + 0.1);
    g.add(door);
  }
  else if (type === 'villa') {
    const w = 16, h = 9, d = 14;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    // سقف مسطح مع درابزين
    const roofTop = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.6, d + 1), BUILDING_MATERIALS.roof.gray);
    roofTop.position.y = h + 0.3;
    roofTop.castShadow = true;
    g.add(roofTop);

    addWindows(g, w, h, d, 3);

    // باب كبير
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 0.3), BUILDING_MATERIALS.door);
    door.position.set(0, 1.75, d / 2 + 0.15);
    g.add(door);

    // أعمدة
    for (let i = -1; i <= 1; i += 2) {
      const col = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, h, 8),
        BUILDING_MATERIALS.wall.cream
      );
      col.position.set(i * (w / 2 - 1), h / 2, d / 2 - 0.5);
      col.castShadow = true;
      g.add(col);
    }
  }
  else if (type === 'tower') {
    const w = 12, h = 30 + level * 3, d = 12;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: 0x78909C }));
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    // نوافذ كثيرة
    const floors = Math.floor(h / 3);
    addWindows(g, w, h, d, floors);

    // قمة ذهبية
    const top = new THREE.Mesh(
      new THREE.ConeGeometry(3, 5, 4),
      BUILDING_MATERIALS.roof.gold
    );
    top.position.y = h + 2.5;
    top.castShadow = true;
    g.add(top);
  }
  else if (type === 'shop') {
    const w = 10, h = 5, d = 10;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      BUILDING_MATERIALS.wall.cream);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    // مظلة ملوّنة
    const awning = new THREE.Mesh(
      new THREE.BoxGeometry(w + 1, 0.3, 2),
      new THREE.MeshLambertMaterial({ color: [0xE53935, 0x43A047, 0x1E88E5][Math.floor(Math.random()*3)] })
    );
    awning.position.set(0, 3.5, d / 2 + 1);
    awning.castShadow = true;
    g.add(awning);

    // واجهة زجاجية
    const glass = new THREE.Mesh(
      new THREE.BoxGeometry(w - 1, 3, 0.2),
      new THREE.MeshLambertMaterial({ color: 0x80DEEA, transparent: true, opacity: 0.7, emissive: 0x1A3A4A })
    );
    glass.position.set(0, 1.8, d / 2 + 0.1);
    g.add(glass);
  }
  else if (type === 'mosque') {
    const w = 14, h = 8, d = 14;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      BUILDING_MATERIALS.wall.white);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    // قبة
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(w * 0.5, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
      BUILDING_MATERIALS.roof.gold
    );
    dome.position.y = h;
    dome.castShadow = true;
    g.add(dome);

    // مآذنة
    const minaret = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 1.2, h + 8, 8),
      BUILDING_MATERIALS.wall.white
    );
    minaret.position.set(w / 2 + 1, (h + 8) / 2, 0);
    minaret.castShadow = true;
    g.add(minaret);

    const minaretTop = new THREE.Mesh(
      new THREE.ConeGeometry(1.5, 3, 8),
      BUILDING_MATERIALS.roof.gold
    );
    minaretTop.position.set(w / 2 + 1, h + 9.5, 0);
    minaretTop.castShadow = true;
    g.add(minaretTop);
  }
  else if (type === 'palace') {
    const w = 24, h = 12, d = 20;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      BUILDING_MATERIALS.wall.cream);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    addWindows(g, w, h, d, 4);

    // قباب ذهبية
    for (let i = -1; i <= 1; i++) {
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(2.5, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        BUILDING_MATERIALS.roof.gold
      );
      dome.position.set(i * 6, h, 0);
      dome.castShadow = true;
      g.add(dome);
    }

    // باب كبير
    const door = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 0.4),
      BUILDING_MATERIALS.roof.gold);
    door.position.set(0, 2.5, d / 2 + 0.2);
    g.add(door);
  }
  else {
    // افتراضي — مبنى بسيط
    const w = 10, h = 6, d = 10;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2;
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);
  }

  return g;
}

const BUILDING_TYPES = ['cottage', 'house', 'villa', 'tower', 'shop', 'mosque', 'palace'];

// ═══════════════════════════════════════════════════════════
//  الأشجار
// ═══════════════════════════════════════════════════════════

const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
const leafMats = [
  new THREE.MeshLambertMaterial({ color: 0x2E7D32 }),
  new THREE.MeshLambertMaterial({ color: 0x388E3C }),
  new THREE.MeshLambertMaterial({ color: 0x43A047 }),
  new THREE.MeshLambertMaterial({ color: 0x4CAF50 })
];

function makeTree() {
  const g = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.6, 3, 6),
    trunkMat
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  g.add(trunk);

  const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];
  const leaves1 = new THREE.Mesh(new THREE.SphereGeometry(2.2, 8, 6), leafMat);
  leaves1.position.y = 4;
  leaves1.castShadow = true;
  g.add(leaves1);

  const leaves2 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 6), leafMat);
  leaves2.position.set(0.8, 5.5, 0.5);
  leaves2.castShadow = true;
  g.add(leaves2);

  const leaves3 = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 6), leafMat);
  leaves3.position.set(-0.7, 5.2, -0.6);
  leaves3.castShadow = true;
  g.add(leaves3);

  return g;
}

// ═══════════════════════════════════════════════════════════
//  أعمدة الإضاءة
// ═══════════════════════════════════════════════════════════

function makeStreetLamp() {
  const g = new THREE.Group();
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x3A3A3A });

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 6, 6), poleMat);
  pole.position.y = 3;
  pole.castShadow = true;
  g.add(pole);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 8),
    new THREE.MeshLambertMaterial({ color: 0xFFF4CC, emissive: 0xFFF4CC, emissiveIntensity: 0.9 })
  );
  head.position.y = 6.3;
  g.add(head);

  return g;
}

// ═══════════════════════════════════════════════════════════
//  السيارات
// ═══════════════════════════════════════════════════════════

const carColors = [0xE53935, 0x1E88E5, 0x43A047, 0xFDD835, 0x8E24AA, 0xFB8C00, 0xF5F5F5, 0x212121];
const cars = [];

function makeCar() {
  const g = new THREE.Group();
  const color = carColors[Math.floor(Math.random() * carColors.length)];
  const bodyMat = new THREE.MeshLambertMaterial({ color });

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 4.5), bodyMat);
  body.position.y = 0.9;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.9, 2.2),
    new THREE.MeshLambertMaterial({ color: 0x9E9E9E })
  );
  cabin.position.y = 1.75;
  cabin.position.z = -0.3;
  cabin.castShadow = true;
  g.add(cabin);

  // عجلات
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1A1A1A });
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 12);
  for (let x of [-1.1, 1.1]) {
    for (let z of [-1.5, 1.5]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, 0.45, z);
      g.add(w);
    }
  }

  // أمامية
  g.userData.speed = 0.3 + Math.random() * 0.3;

  return g;
}

// ═══════════════════════════════════════════════════════════
//  المواطنون
// ═══════════════════════════════════════════════════════════

const citizenColors = [0xE53935, 0x1E88E5, 0x43A047, 0xFDD835, 0x8E24AA, 0xFB8C00, 0x26C6DA, 0xFF7043];
const citizens = [];

function makeCitizen() {
  const g = new THREE.Group();
  const color = citizenColors[Math.floor(Math.random() * citizenColors.length)];

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 1.2, 8),
    new THREE.MeshLambertMaterial({ color })
  );
  body.position.y = 0.6;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 8),
    new THREE.MeshLambertMaterial({ color: 0xFFCC99 })
  );
  head.position.y = 1.55;
  head.castShadow = true;
  g.add(head);

  g.userData.speed = 0.06 + Math.random() * 0.06;
  g.userData.angle = Math.random() * Math.PI * 2;

  return g;
}

// ═══════════════════════════════════════════════════════════
//  بناء المدينة
// ═══════════════════════════════════════════════════════════

const plotMeshes = [];       // للتفاعل
const plotGroup = new THREE.Group();
scene.add(plotGroup);

let totalBuildings = 0;

// شبكة القطع
const plotData = {};         // "x_z" → {mesh, hasBuilding}

for (let gx = 0; gx < GRID; gx++) {
  for (let gz = 0; gz < GRID; gz++) {
    const px = (gx - GRID / 2 + 0.5) * TILE;
    const pz = (gz - GRID / 2 + 0.5) * TILE;

    // ما نبنيوش فوق الساحة المركزية
    const distToCenter = Math.sqrt(px * px + pz * pz);
    const isCenter = distToCenter < TILE * 2.2;

    // ما نبنيوش فوق الطرق
    const modX = Math.abs(gx - GRID / 2);
    const modZ = Math.abs(gz - GRID / 2);
    const onRoad = (modX < 1 || modZ < 1);

    if (isCenter || onRoad) continue;

    // قطعة الأرض
    const plotGeo = new THREE.BoxGeometry(TILE * 0.9, 0.3, TILE * 0.9);
    const plotMat = new THREE.MeshLambertMaterial({ color: 0xB8A878 });
    const plot = new THREE.Mesh(plotGeo, plotMat);
    plot.position.set(px, 0.65, pz);
    plot.receiveShadow = true;

    // قرار: 60% مبنى
    const hasBuilding = Math.random() > 0.4;
    let buildingType = null;

    if (hasBuilding) {
      // احتمال حسب البعد عن المركز
      const r = Math.random();
      if (distToCenter < TILE * 4) {
        buildingType = r < 0.3 ? 'tower' : (r < 0.5 ? 'villa' : (r < 0.7 ? 'shop' : (r < 0.9 ? 'house' : 'palace')));
      } else if (distToCenter < TILE * 6) {
        buildingType = r < 0.4 ? 'house' : (r < 0.7 ? 'shop' : 'villa');
      } else {
        buildingType = r < 0.5 ? 'cottage' : 'house';
      }

      // أحد المساجد
      if (Math.random() < 0.05) buildingType = 'mosque';

      const building = makeBuilding(buildingType, 1);
      building.position.set(px, 0.8, pz);
      plotGroup.add(building);
      totalBuildings++;
    }

    plotGroup.add(plot);

    plot.userData = {
      gx, gz, px, pz,
      hasBuilding,
      buildingType
    };

    plotMeshes.push(plot);
    plotData[gx + '_' + gz] = { plot, hasBuilding, buildingType };
  }
}

// تحديث العدّاد
document.getElementById('plotCount').textContent = plotMeshes.length;
document.getElementById('buildingCount').textContent = totalBuildings;

// ═══════════════════════════════════════════════════════════
//  الأشجار على الأرصفة
// ═══════════════════════════════════════════════════════════

for (let i = 0; i < 60; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = TILE * 2.5 + Math.random() * (HALF - TILE * 3);
  const tx = Math.cos(angle) * dist;
  const tz = Math.sin(angle) * dist;

  // بعيد عن القطع
  let conflict = false;
  for (const p of plotMeshes) {
    const dx = p.position.x - tx;
    const dz = p.position.z - tz;
    if (dx * dx + dz * dz < TILE * TILE * 0.8) { conflict = true; break; }
  }
  if (conflict) continue;

  const tree = makeTree();
  tree.position.set(tx, 0, tz);
  const s = 0.8 + Math.random() * 0.6;
  tree.scale.set(s, s, s);
  scene.add(tree);
}

// ═══════════════════════════════════════════════════════════
//  أعمدة الإضاءة على الطرق
// ═══════════════════════════════════════════════════════════

for (let i = 0; i < 24; i++) {
  const horizontal = i % 2 === 0;
  const row = (i % 6) - 2.5;
  const col = Math.floor(i / 6) - 1.5;

  let x, z;
  if (horizontal) {
    x = col * (WORLD_SIZE / 3);
    z = (i % 4) * 30 - 45;
  } else {
    x = (i % 4) * 30 - 45;
    z = col * (WORLD_SIZE / 3);
  }

  const lamp = makeStreetLamp();
  lamp.position.set(x, 0, z);
  scene.add(lamp);
}

// ═══════════════════════════════════════════════════════════
//  السيارات المتحركة
// ═══════════════════════════════════════════════════════════

for (let i = 0; i < 12; i++) {
  const car = makeCar();
  const road = Math.floor(i / 4);
  const lane = (i % 4) % 2 === 0 ? 1 : -1;
  const offset = (i % 4) - 1.5;
  const prog = Math.random() * WORLD_SIZE - HALF;

  if (road === 0) {
    // طريق أفقي علوي
    car.position.set(prog, 0.8, -WORLD_SIZE / 3 + lane * 3);
    car.rotation.y = lane > 0 ? 0 : Math.PI;
    car.userData.axis = 'x';
    car.userData.dir = lane > 0 ? 1 : -1;
  } else if (road === 1) {
    // طريق أفقي مركزي
    car.position.set(prog, 0.8, lane * 3);
    car.rotation.y = lane > 0 ? 0 : Math.PI;
    car.userData.axis = 'x';
    car.userData.dir = lane > 0 ? 1 : -1;
  } else if (road === 2) {
    // طريق عمودي
    car.position.set(lane * 3, 0.8, prog);
    car.rotation.y = lane > 0 ? Math.PI / 2 : -Math.PI / 2;
    car.userData.axis = 'z';
    car.userData.dir = lane > 0 ? 1 : -1;
  }

  scene.add(car);
  cars.push(car);
}

// ═══════════════════════════════════════════════════════════
//  المواطنون
// ═══════════════════════════════════════════════════════════

for (let i = 0; i < 40; i++) {
  const c = makeCitizen();
  const angle = Math.random() * Math.PI * 2;
  const dist = TILE * 2 + Math.random() * (HALF - TILE * 3);
  c.position.set(Math.cos(angle) * dist, 0.3, Math.sin(angle) * dist);
  scene.add(c);
  citizens.push(c);
}

// ═══════════════════════════════════════════════════════════
//  التفاعل — اضغط على قطعة
// ═══════════════════════════════════════════════════════════

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos.x = e.clientX;
  downPos.y = e.clientY;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dx = e.clientX - downPos.x;
  const dy = e.clientY - downPos.y;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return;  // drag وليس tap

  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(plotMeshes);

  if (hits.length > 0) {
    showPlotPanel(hits[0].object.userData);
  }
});

function showPlotPanel(data) {
  const panel = document.getElementById('plotPanel');
  const content = document.getElementById('pContent');
  document.getElementById('pCoords').textContent = `إحداثيات: (${data.gx}, ${data.gz})`;

  if (data.hasBuilding) {
    const typeName = {
      cottage: '🏚️ كوخ',
      house: '🏠 بيت',
      villa: '🏡 فيلا',
      tower: '🏢 برج',
      shop: '🏪 محل',
      mosque: '🕌 مسجد',
      palace: '🏰 قصر'
    }[data.buildingType] || '🏠 مبنى';

    const price = {
      cottage: 15000, house: 50000, villa: 200000,
      tower: 500000, shop: 100000, mosque: 0, palace: 1000000
    }[data.buildingType] || 50000;

    document.getElementById('pTitle').textContent = '🏗️ مبنى';
    content.innerHTML = `
      <div class="info-row">النوع: <b>${typeName}</b></div>
      <div class="info-row">الحالة: <b>مبني ✓</b></div>
      ${price ? `<div class="price">💰 ${price.toLocaleString()} Đ</div>` : ''}
    `;
  } else {
    document.getElementById('pTitle').textContent = '📍 قطعة أرض';
    content.innerHTML = `
      <div class="info-row">الحالة: <b>فاضية</b></div>
      <div class="info-row">المساحة: <b>${TILE}×${TILE} وحدة</b></div>
      <div class="price">💰 10,000 Đ</div>
    `;
  }
  panel.classList.add('show');
}

function closePanel() {
  document.getElementById('plotPanel').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════

let time = 0;
let lastFrame = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  time += dt;

  // السيارات
  for (const car of cars) {
    const axis = car.userData.axis;
    const dir = car.userData.dir;
    const speed = car.userData.speed * 60;

    if (axis === 'x') {
      car.position.x += dir * speed * dt;
      if (car.position.x > HALF + 30) car.position.x = -HALF - 30;
      if (car.position.x < -HALF - 30) car.position.x = HALF + 30;
    } else {
      car.position.z += dir * speed * dt;
      if (car.position.z > HALF + 30) car.position.z = -HALF - 30;
      if (car.position.z < -HALF - 30) car.position.z = HALF + 30;
    }
  }

  // المواطنون
  for (const c of citizens) {
    const speed = c.userData.speed * 60;
    c.position.x += Math.cos(c.userData.angle) * speed * dt;
    c.position.z += Math.sin(c.userData.angle) * speed * dt;

    // تغيير الاتجاه
    c.userData.angle += (Math.random() - 0.5) * 0.5 * dt;

    const limit = HALF - TILE;
    if (c.position.x > limit || c.position.x < -limit ||
        c.position.z > limit || c.position.z < -limit) {
      c.userData.angle += Math.PI;
    }

    // أنيميشن مشي
    c.position.y = 0.3 + Math.abs(Math.sin(time * 4 + c.id)) * 0.08;
  }

  controls.update();
  renderer.render(scene, camera);
}
