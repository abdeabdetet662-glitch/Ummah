<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مدينة أُمّة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0E1A; font-family: -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }

  /* ═══ Loading ═══ */
  #loading {
    position: fixed; inset: 0; z-index: 1000;
    background: linear-gradient(135deg, #0A0510, #1A0F2E, #0A0510);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    color: #D4AF37;
  }
  .loader-ring {
    width: 80px; height: 80px; margin-bottom: 30px;
    border: 4px solid rgba(212,175,55,0.15);
    border-top: 4px solid #D4AF37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 16px; letter-spacing: 2px; }
  .loader-sub { font-size: 12px; color: #9CA3AF; margin-top: 8px; }
  .loader-bar {
    width: 200px; height: 3px; background: rgba(212,175,55,0.15);
    border-radius: 2px; margin-top: 24px; overflow: hidden;
  }
  .loader-bar-fill {
    height: 100%; width: 0%; background: #D4AF37;
    animation: loadBar 4s ease-out forwards;
  }
  @keyframes loadBar { to { width: 100%; } }

  /* ═══ HUD أعلى يمين ═══ */
  #hudTop {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    background: rgba(10,5,16,0.85);
    color: #D4AF37; padding: 8px 14px;
    border-radius: 10px; font-size: 12px;
    border: 1px solid rgba(212,175,55,0.4);
    backdrop-filter: blur(10px);
    display: flex; gap: 12px;
  }
  #hudTop .item { display: flex; align-items: center; gap: 6px; }
  #hudTop .val { color: #FFD700; font-weight: bold; }

  /* ═══ أزرار تحكم أعلى يسار ═══ */
  #hudControls {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
  }
  #hudControls button {
    width: 44px; height: 44px;
    background: rgba(10,5,16,0.85);
    color: #D4AF37; border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px; font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.15s;
  }
  #hudControls button:active {
    transform: scale(0.92);
    background: rgba(212,175,55,0.2);
  }

  /* ═══ Joystick (أسفل يسار) ═══ */
  #joystickZone {
    position: fixed; bottom: 40px; left: 40px;
    width: 140px; height: 140px; z-index: 100;
    border-radius: 50%;
    background: rgba(10,5,16,0.5);
    border: 2px solid rgba(212,175,55,0.3);
    backdrop-filter: blur(10px);
    touch-action: none;
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFD700, #D4AF37, #A08020);
    box-shadow: 0 4px 20px rgba(212,175,55,0.5);
    pointer-events: none;
    transition: transform 0.08s;
  }
  #joystickArrows {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #joystickArrows span {
    position: absolute; color: rgba(212,175,55,0.4);
    font-size: 18px; font-weight: bold;
  }
  #joystickArrows .up { top: 8px; left: 50%; transform: translateX(-50%); }
  #joystickArrows .down { bottom: 8px; left: 50%; transform: translateX(-50%); }
  #joystickArrows .left { left: 8px; top: 50%; transform: translateY(-50%); }
  #joystickArrows .right { right: 8px; top: 50%; transform: translateY(-50%); }

  /* ═══ Cam Control (أسفل يمين) ═══ */
  #camControl {
    position: fixed; bottom: 40px; right: 40px;
    width: 140px; height: 140px; z-index: 100;
    border-radius: 50%;
    background: rgba(10,5,16,0.5);
    border: 2px solid rgba(212,175,55,0.3);
    backdrop-filter: blur(10px);
    touch-action: none;
  }
  #camKnob {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #9333EA, #6B21A8);
    box-shadow: 0 4px 20px rgba(147,51,234,0.5);
    pointer-events: none;
    transition: transform 0.08s;
  }
  #camLabel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.6); font-size: 10px;
    pointer-events: none;
  }

  /* ═══ Action Buttons (يمين) ═══ */
  #actionBtns {
    position: fixed; bottom: 200px; right: 40px;
    display: flex; flex-direction: column; gap: 10px; z-index: 100;
  }
  #actionBtns button {
    width: 56px; height: 56px;
    background: rgba(10,5,16,0.85);
    color: #D4AF37; border: 2px solid rgba(212,175,55,0.5);
    border-radius: 50%; font-size: 22px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.15s;
  }
  #actionBtns button:active {
    transform: scale(0.9);
    background: rgba(212,175,55,0.25);
  }

  /* ═══ Panel (لوحة تفاعل) ═══ */
  #interactPanel {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.7);
    display: none; align-items: flex-end;
    backdrop-filter: blur(6px);
  }
  #interactPanel.show { display: flex; }
  #interactPanel .panel {
    width: 100%; max-height: 80vh; overflow-y: auto;
    background: linear-gradient(180deg, #1A0F2E, #0A0510);
    border-top-left-radius: 28px; border-top-right-radius: 28px;
    border-top: 3px solid #D4AF37;
    padding: 28px 22px 40px;
    animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #interactPanel h3 {
    color: #D4AF37; font-size: 24px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  #interactPanel .desc { color: #9CA3AF; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  #interactPanel .info-row {
    color: #F5F5F5; font-size: 14px; padding: 10px 0;
    border-bottom: 1px solid rgba(212,175,55,0.15);
    display: flex; justify-content: space-between;
  }
  #interactPanel .btns {
    display: flex; gap: 12px; margin-top: 24px;
  }
  #interactPanel button {
    flex: 1; padding: 16px; border: none; border-radius: 14px;
    font-size: 15px; font-weight: bold; font-family: inherit;
    cursor: pointer; transition: transform 0.15s;
  }
  #interactPanel button:active { transform: scale(0.96); }
  #interactPanel .btn-open {
    background: linear-gradient(135deg, #FFD700, #D4AF37);
    color: #0A0510;
  }
  #interactPanel .btn-close {
    background: #2A1535; color: #F5F5F5;
  }

  /* ═══ Toast ═══ */
  .toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,5,16,0.96); color: #D4AF37;
    padding: 14px 24px; border-radius: 14px;
    border: 2px solid #D4AF37;
    font-size: 14px; z-index: 600;
    display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 85vw; text-align: center;
  }
  .toast.show {
    display: block;
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ═══ Hint (تعليمات) ═══ */
  #hint {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: rgba(212,175,55,0.6);
    font-size: 11px; z-index: 50;
    pointer-events: none;
    text-align: center;
  }

  /* ═══ Minimap (أعلى يمين تحت HUD) ═══ */
  #minimap {
    position: fixed; top: 70px; right: 16px;
    width: 100px; height: 100px; z-index: 100;
    background: rgba(10,5,16,0.85);
    border-radius: 12px;
    border: 1px solid rgba(212,175,55,0.4);
    backdrop-filter: blur(10px);
    overflow: hidden;
  }
  #minimap canvas {
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">🏙️ مدينَة أُمّة</div>
  <div class="loader-sub">جاري تحميل المدينة...</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div id="hudTop">
  <div class="item">🏢 <span class="val" id="buildingCount">0</span></div>
  <div class="item">🏆 <span class="val" id="landmarkCount">0</span></div>
</div>

<div id="hudControls">
  <button onclick="toggleDayNight()" id="btnDayNight">🌙</button>
  <button onclick="resetCamera()">🎯</button>
  <button onclick="toggleCameraMode()" id="btnCamMode">👤</button>
</div>

<div id="minimap">
  <canvas id="minimapCanvas" width="100" height="100"></canvas>
</div>

<div id="joystickZone">
  <div id="joystickArrows">
    <span class="up">▲</span>
    <span class="down">▼</span>
    <span class="left">◀</span>
    <span class="right">▶</span>
  </div>
  <div id="joystickKnob"></div>
</div>

<div id="camControl">
  <div id="camLabel">📷</div>
  <div id="camKnob"></div>
</div>

<div id="actionBtns">
  <button onclick="interactNearby()" title="تفاعل">✋</button>
  <button onclick="runAction()" title="جري">🏃</button>
</div>

<div id="interactPanel">
  <div class="panel">
    <h3 id="pTitle">📍 مكان</h3>
    <div class="desc" id="pDesc"></div>
    <div id="pInfo"></div>
    <div class="btns">
      <button class="btn-close" onclick="closePanel()">إغلاق</button>
      <button class="btn-open" onclick="openCurrentActivity()">🚪 ادخل</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="hint">🕹️ اسحب Joystick للحركة • 📷 CamControl للكاميرا • ✋ للتفاعل</div>

<script src="../avatar/libs/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  الإعدادات العامة
// ═══════════════════════════════════════════════════════════

const WORLD = 1000;
const HALF = WORLD / 2;
const GRID = 20;            // 20×20 = 400 قطعة
const PLOT = WORLD / GRID;  // 50 وحدة لكل قطعة

// ═══════════════════════════════════════════════════════════
//  Scene + Camera + Renderer
// ═══════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xB8D9F0, 600, 2000);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(0, 15, 20);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════════════════════
//  الإضاءة — نهاري مشرق
// ═══════════════════════════════════════════════════════════

const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xB8D9F0, 0x6B8F5A, 0.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF4CC, 1.1);
sun.position.set(400, 600, 300);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 2000;
sun.shadow.camera.left = -800;
sun.shadow.camera.right = 800;
sun.shadow.camera.top = 800;
sun.shadow.camera.bottom = -800;
sun.shadow.bias = -0.0005;
scene.add(sun);

// إضاءة مسائية (شمس ثانية دافئة)
const warmLight = new THREE.DirectionalLight(0xFFB060, 0.25);
warmLight.position.set(-200, 300, -400);
scene.add(warmLight);

// ═══════════════════════════════════════════════════════════
//  السماء
// ═══════════════════════════════════════════════════════════

const skyGeo = new THREE.SphereGeometry(2500, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x2E6BC8) },
    bottomColor: { value: new THREE.Color(0xC8E0F0) },
    offset: { value: 300 },
    exponent: { value: 0.8 }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor; uniform vec3 bottomColor;
    uniform float offset; uniform float exponent;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
      float f = max(pow(max(h, 0.0), exponent), 0.0);
      gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ═══════════════════════════════════════════════════════════
//  القمر + الشمس (عناصر بصرية)
// ═══════════════════════════════════════════════════════════

// الشمس (كيان بصري)
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(40, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xFFEB80 })
);
sunMesh.position.set(800, 900, 400);
scene.add(sunMesh);

// ═══════════════════════════════════════════════════════════
//  الأرضية (عشب)
// ═══════════════════════════════════════════════════════════

const grassMat = new THREE.MeshLambertMaterial({ color: 0x6BA85A });
const grass = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 3, WORLD * 3), grassMat);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

// أرضية المدينة (متنوعة)
const cityGroundMat = new THREE.MeshLambertMaterial({ color: 0x7CB868 });
const cityGround = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, WORLD), cityGroundMat);
cityGround.rotation.x = -Math.PI / 2;
cityGround.position.y = 0.02;
cityGround.receiveShadow = true;
scene.add(cityGround);

// ═══════════════════════════════════════════════════════════
//  الطرق — شبكة 3×3 كبيرة
// ═══════════════════════════════════════════════════════════

const roadMat = new THREE.MeshLambertMaterial({ color: 0x2A2A2A });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xB0A8A0 });
const roadLineMat = new THREE.MeshBasicMaterial({ color: 0xFFEB3B });

// الرصيف
function makeRoadH(z, width) {
  // الرصيف
  const sw = new THREE.Mesh(new THREE.BoxGeometry(WORLD, 0.6, width + 8), sidewalkMat);
  sw.position.set(0, 0.3, z);
  sw.receiveShadow = true;
  scene.add(sw);

  // الطريق
  const road = new THREE.Mesh(new THREE.BoxGeometry(WORLD, 0.85, width), roadMat);
  road.position.set(0, 0.42, z);
  road.receiveShadow = true;
  scene.add(road);

  // خطوط صفراء
  for (let x = -HALF + 10; x < HALF; x += 25) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(12, 0.1, 0.7), roadLineMat);
    line.position.set(x, 0.9, z);
    scene.add(line);
  }
}

function makeRoadV(x, width) {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(width + 8, 0.6, WORLD), sidewalkMat);
  sw.position.set(x, 0.3, 0);
  sw.receiveShadow = true;
  scene.add(sw);

  const road = new THREE.Mesh(new THREE.BoxGeometry(width, 0.85, WORLD), roadMat);
  road.position.set(x, 0.42, 0);
  road.receiveShadow = true;
  scene.add(road);

  for (let z = -HALF + 10; z < HALF; z += 25) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 12), roadLineMat);
    line.position.set(x, 0.9, z);
    scene.add(line);
  }
}

const ROAD_W = 18;

// طرق أفقية
makeRoadH(-300, ROAD_W);
makeRoadH(0, ROAD_W);
makeRoadH(300, ROAD_W);

// طرق عمودية
makeRoadV(-300, ROAD_W);
makeRoadV(0, ROAD_W);
makeRoadV(300, ROAD_W);

// ═══════════════════════════════════════════════════════════
//  الرصيف المضيء عند الحواف (Edge glow)
// ═══════════════════════════════════════════════════════════

// ممرات المشاة
const crossMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
for (let i = -1; i <= 1; i++) {
  for (let j = -1; j <= 1; j++) {
    for (let k = 0; k < 6; k++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 10), crossMat);
      stripe.position.set(i * 300 + (k - 2.5) * 2, 0.9, j * 300 + ROAD_W / 2 + 10);
      scene.add(stripe);

      const stripe2 = new THREE.Mesh(new THREE.BoxGeometry(10, 0.9, 0.6), crossMat);
      stripe2.position.set(i * 300 + ROAD_W / 2 + 10, 0.9, j * 300 + (k - 2.5) * 2);
      scene.add(stripe2);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  الساحة المركزية (رئيسية)
// ═══════════════════════════════════════════════════════════

const plazaMat = new THREE.MeshLambertMaterial({ color: 0xE8DCC8 });
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(80, 80, 0.8, 32), plazaMat);
plaza.position.y = 0.4;
plaza.receiveShadow = true;
scene.add(plaza);

// نمط الفسيفساء
const mosaicMat1 = new THREE.MeshLambertMaterial({ color: 0xD4AF37 });
const mosaic1 = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 0.85, 32), mosaicMat1);
mosaic1.position.y = 0.42;
scene.add(mosaic1);

const mosaic2 = new THREE.Mesh(new THREE.CylinderGeometry(50, 50, 0.86, 32), plazaMat);
mosaic2.position.y = 0.43;
scene.add(mosaic2);

const mosaic3 = new THREE.Mesh(new THREE.CylinderGeometry(30, 30, 0.87, 32), mosaicMat1);
mosaic3.position.y = 0.44;
scene.add(mosaic3);

// النافورة المركزية
const fountainGroup = new THREE.Group();
const fountainBase = new THREE.Mesh(
  new THREE.CylinderGeometry(15, 15, 1.5, 32),
  new THREE.MeshLambertMaterial({ color: 0xE8DCC8 })
);
fountainBase.position.y = 0.75;
fountainBase.castShadow = true; fountainBase.receiveShadow = true;
fountainGroup.add(fountainBase);

const fountainWater = new THREE.Mesh(
  new THREE.CylinderGeometry(13, 13, 1, 32),
  new THREE.MeshLambertMaterial({
    color: 0x4FC3F7, transparent: true, opacity: 0.85
  })
);
fountainWater.position.y = 1.5;
fountainGroup.add(fountainWater);

const fountainPillar = new THREE.Mesh(
  new THREE.CylinderGeometry(1.5, 1.5, 6, 12),
  new THREE.MeshLambertMaterial({ color: 0xE8DCC8 })
);
fountainPillar.position.y = 4.5;
fountainPillar.castShadow = true;
fountainGroup.add(fountainPillar);

const fountainTop = new THREE.Mesh(
  new THREE.SphereGeometry(2, 16, 12),
  new THREE.MeshLambertMaterial({ color: 0xD4AF37 })
);
fountainTop.position.y = 8;
fountainTop.castShadow = true;
fountainGroup.add(fountainTop);

fountainGroup.position.y = 0.9;
scene.add(fountainGroup);

// ═══════════════════════════════════════════════════════════
//  مواد المباني — عربي حديث
// ═══════════════════════════════════════════════════════════

const WALL_MATS = [
  new THREE.MeshLambertMaterial({ color: 0xF5F0E8 }),   // أبيض عاجي
  new THREE.MeshLambertMaterial({ color: 0xE8DCC8 }),   // بيج فاتح
  new THREE.MeshLambertMaterial({ color: 0xD8C8B0 }),   // بيج
  new THREE.MeshLambertMaterial({ color: 0xE8D8B8 }),   // رملي
  new THREE.MeshLambertMaterial({ color: 0xF0E8D8 }),   // كريمي
  new THREE.MeshLambertMaterial({ color: 0xC8B898 }),   // بني فاتح
  new THREE.MeshLambertMaterial({ color: 0xE0D0B8 })    // رملي دافئ
];

const ACCENT_MATS = [
  new THREE.MeshLambertMaterial({ color: 0xD4AF37 }),   // ذهبي
  new THREE.MeshLambertMaterial({ color: 0xB8941F }),   // ذهبي غامق
  new THREE.MeshLambertMaterial({ color: 0x8B6F47 })    // خشبي
];

const ROOF_MATS = [
  new THREE.MeshLambertMaterial({ color: 0xA8906A }),   // بني رملي
  new THREE.MeshLambertMaterial({ color: 0x8B7355 }),   // بني غامق
  new THREE.MeshLambertMaterial({ color: 0xC4A878 }),   // رملي
  new THREE.MeshLambertMaterial({ color: 0x7A6248 })    // بني خشبي
];

const GLASS_MAT = new THREE.MeshLambertMaterial({
  color: 0x87CEEB,
  emissive: 0x4A7AB0,
  emissiveIntensity: 0.25,
  transparent: true,
  opacity: 0.85
});

const DOOR_MAT = new THREE.MeshLambertMaterial({ color: 0x8B5A3A });
const TRIM_MAT = new THREE.MeshLambertMaterial({ color: 0xF5F0E8 });

// ═══════════════════════════════════════════════════════════
//  مولّد النوافذ العربية
// ═══════════════════════════════════════════════════════════

function addArabesqueWindows(parent, w, h, d, floors, wallColor) {
  const colsX = Math.max(2, Math.floor(w / 4));
  const colsZ = Math.max(2, Math.floor(d / 4));
  const rows = Math.max(1, floors);

  // النوافذ على المحور الأمامي والخلفي (Z)
  for (let f = 0; f < rows; f++) {
    const y = 2 + f * 3.2;

    for (let c = 0; c < colsX; c++) {
      const x = -w / 2 + 3 + c * ((w - 6) / (colsX - 1 || 1));

      // نوافذ أمامية
      const window1 = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, 0.15), GLASS_MAT);
      window1.position.set(x, y, d / 2 + 0.08);
      parent.add(window1);

      // إطار أمامي ذهبي
      const frame1Top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 0.25), ACCENT_MATS[0]);
      frame1Top.position.set(x, y + 1.2, d / 2 + 0.1);
      parent.add(frame1Top);

      const frame1Bot = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 0.25), ACCENT_MATS[0]);
      frame1Bot.position.set(x, y - 1.2, d / 2 + 0.1);
      parent.add(frame1Bot);

      // قوس علوي
      const arch1 = new THREE.Mesh(
        new THREE.CylinderGeometry(1, 1, 0.15, 8, 1, false, 0, Math.PI),
        ACCENT_MATS[0]
      );
      arch1.rotation.x = Math.PI / 2;
      arch1.rotation.z = Math.PI;
      arch1.position.set(x, y + 1.3, d / 2 + 0.1);
      parent.add(arch1);

      // نوافذ خلفية
      const window2 = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, 0.15), GLASS_MAT);
      window2.position.set(x, y, -d / 2 - 0.08);
      parent.add(window2);
    }

    for (let c = 0; c < colsZ; c++) {
      const z = -d / 2 + 3 + c * ((d - 6) / (colsZ - 1 || 1));

      const window1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.2, 2), GLASS_MAT);
      window1.position.set(w / 2 + 0.08, y, z);
      parent.add(window1);

      const window2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.2, 2), GLASS_MAT);
      window2.position.set(-w / 2 - 0.08, y, z);
      parent.add(window2);
    }
  }
}

function addDome(parent, radius, y) {
  const dome = new THREE.Mesh(

//  مولّد المبنى العربي الحديث
// ═══════════════════════════════════════════════════════════

function makeArabBuilding(w, h, d, floors, style) {
  const g = new THREE.Group();

  // اختر نمط الألوان
  const wallMat = WALL_MATS[Math.floor(Math.random() * WALL_MATS.length)];
  const roofMat = ROOF_MATS[Math.floor(Math.random() * ROOF_MATS.length)];

  // ═══ الهيكل الأساسي ═══
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  box.position.y = h / 2;
  box.castShadow = true;
  box.receiveShadow = true;
  g.add(box);

  // ═══ شريط ذهبي عند القاعدة ═══
  const baseTrim = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.6, 0.4, d + 0.6),
    ACCENT_MATS[0]
  );
  baseTrim.position.y = 0.4;
  g.add(baseTrim);

  // ═══ النوافذ ═══
  addArabesqueWindows(g, w, h, d, floors, wallMat);

  // ═══ الباب ═══
  const door = new THREE.Mesh(new THREE.BoxGeometry(2.5, 4, 0.2), DOOR_MAT);
  door.position.set(0, 2, d / 2 + 0.1);
  g.add(door);

  // إطار الباب ذهبي
  const doorFrameL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.5, 0.3), ACCENT_MATS[0]);
  doorFrameL.position.set(-1.5, 2.25, d / 2 + 0.15);
  g.add(doorFrameL);

  const doorFrameR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.5, 0.3), ACCENT_MATS[0]);
  doorFrameR.position.set(1.5, 2.25, d / 2 + 0.15);
  g.add(doorFrameR);

  const doorFrameT = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.3, 0.3), ACCENT_MATS[0]);
  doorFrameT.position.set(0, 4.65, d / 2 + 0.15);
  g.add(doorFrameT);

  // ═══ السقف — حسب النوع ═══

  if (style === 'dome') {
    // قبة ذهبية
    addDome(g, w * 0.45, h);

    // شرفة صغيرة تحت القبة
    const ring = new THREE.Mesh(
      new THREE.CylinderGeometry(w * 0.5, w * 0.5, 0.5, 16),
      ACCENT_MATS[0]
    );
    ring.position.y = h;
    g.add(ring);
  }
  else if (style === 'flat') {
    // سقف مسطح بدرابزين
    const roofSlab = new THREE.Mesh(
      new THREE.BoxGeometry(w + 1, 0.6, d + 1),
      roofMat
    );
    roofSlab.position.y = h + 0.3;
    roofSlab.castShadow = true;
    g.add(roofSlab);

    // درابزين صغير
    const railMat = ACCENT_MATS[0];
    const railTop = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.2, 0.2), railMat);
    railTop.position.set(0, h + 1.5, d / 2 + 0.5);
    g.add(railTop);

    const railBottom = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.2, 0.2), railMat);
    railBottom.position.set(0, h + 0.7, d / 2 + 0.5);
    g.add(railBottom);

    // أعمدة الدرابزين
    for (let i = -w / 2; i <= w / 2; i += 2) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.8, 0.15), railMat);
      post.position.set(i, h + 1.1, d / 2 + 0.5);
      g.add(post);
    }
  }
  else if (style === 'arch') {
    // سقف بأقواس
    for (let i = -w / 3; i <= w / 3; i += w / 3) {
      const arch = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.5, 0.4, 12, 1, false, 0, Math.PI),
        ACCENT_MATS[0]
      );
      arch.rotation.x = Math.PI / 2;
      arch.rotation.z = Math.PI;
      arch.position.set(i, h + 1, 0);
      g.add(arch);
    }

    const flat = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.5, 0.5, d + 0.5),
      roofMat
    );
    flat.position.y = h + 0.25;
    g.add(flat);
  }
  else if (style === 'tower') {
    // بلا سقف خاص، فقط إطار ذهبي
    const topTrim = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.6, 0.6, d + 0.6),
      ACCENT_MATS[0]
    );
    topTrim.position.y = h;
    g.add(topTrim);

    // منارة صغيرة
    const lantern = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 3, 8),
      ACCENT_MATS[0]
    );
    lantern.position.y = h + 2;
    g.add(lantern);

    const lanternDome = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
      ACCENT_MATS[0]
    );
    lanternDome.position.y = h + 3.5;
    g.add(lanternDome);
  }

  return g;
}

// ═══ 50 مبنى عربي حديث ═══
const buildingStyles = ['dome', 'flat', 'arch', 'tower'];

for (let i = 0; i < 50; i++) {
  let x, z, tries = 0, valid = false;

  // نختارو موقع مناسب
  do {
    tries++;
    x = (Math.random() - 0.5) * (WORLD - 80);
    z = (Math.random() - 0.5) * (WORLD - 80);

    // بعيد على المعالم
    let tooClose = false;

    // بعيد على الطرق
    if (Math.abs(x - (-300)) < 20) continue;
    if (Math.abs(x - 0) < 20) continue;
    if (Math.abs(x - 300) < 20) continue;
    if (Math.abs(z - (-300)) < 20) continue;
    if (Math.abs(z - 0) < 20) continue;
    if (Math.abs(z - 300) < 20) continue;

    // بعيد على النافورة
    if (Math.sqrt(x * x + z * z) < 100) continue;

    // بعيد على المعالم
    for (const lm of landmarks) {
      const dx = x - lm.position.x;
      const dz = z - lm.position.z;
      const radius = lm.userData.radius || 30;
      if (Math.sqrt(dx * dx + dz * dz) < radius + 15) {
        tooClose = true;
        break;
      }
    }

    valid = !tooClose;

    if (tries > 50) break;

const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
const trunkDarkMat = new THREE.MeshLambertMaterial({ color: 0x3E2723 });
const leafMats = [

function makeTree(variant) {
  const g = new THREE.Group();
  const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];

  if (variant === 'palm') {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 10, 8), trunkMat);
    trunk.position.y = 5;
    trunk.castShadow = true;
    g.add(trunk);

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.8, 5, 4), leafMat);
      leaf.position.y = 10;
      leaf.rotation.z = Math.PI / 2.5;
      leaf.rotation.y = angle;
      leaf.position.x = Math.cos(angle) * 2;
      leaf.position.z = Math.sin(angle) * 2;
      leaf.castShadow = true;
      g.add(leaf);
    }
  } else if (variant === 'pine') {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), trunkDarkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    g.add(trunk);

    for (let i = 0; i < 3; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(3 - i * 0.7, 4, 8), leafMat);
      cone.position.y = 3.5 + i * 2;
      cone.castShadow = true;
      g.add(cone);
    }
  } else {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), trunkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    g.add(trunk);

    const l1 = new THREE.Mesh(new THREE.SphereGeometry(2.4, 8, 6), leafMat);
    l1.position.y = 4.2;
    l1.castShadow = true;
    g.add(l1);

    const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 6), leafMat);
    l2.position.set(1, 5.5, 0.5);
    l2.castShadow = true;
    g.add(l2);

    const l3 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 6), leafMat);
    l3.position.set(-0.8, 5.2, -0.7);
    l3.castShadow = true;
    g.add(l3);
  }

  return g;
}

const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
let joystickInput = { x: 0, y: 0 };

const MAX_JOY_RADIUS = 50;

function joystickStartHandler(e) {
  e.preventDefault();
  joystickActive = true;
  const touch = e.touches ? e.touches[0] : e;
  const rect = joystickZone.getBoundingClientRect();
  joystickStart.x = rect.left + rect.width / 2;
  joystickStart.y = rect.top + rect.height / 2;
  joystickMoveHandler(e);
}

function joystickMoveHandler(e) {
  if (!joystickActive) return;
  e.preventDefault();

  const touch = e.touches ? e.touches[0] : e;
  let dx = touch.clientX - joystickStart.x;
  let dy = touch.clientY - joystickStart.y;

  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_JOY_RADIUS) {
    dx = (dx / dist) * MAX_JOY_RADIUS;
    dy = (dy / dist) * MAX_JOY_RADIUS;
  }

  // نحدّث Knob
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  // نحدّث الإدخال
  joystickInput.x = dx / MAX_JOY_RADIUS;
  joystickInput.y = dy / MAX_JOY_RADIUS;
}

function joystickEndHandler(e) {
  joystickActive = false;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  joystickInput.x = 0;
  joystickInput.y = 0;
}

joystickZone.addEventListener('touchstart', joystickStartHandler, { passive: false });
joystickZone.addEventListener('touchmove', joystickMoveHandler, { passive: false });
joystickZone.addEventListener('touchend', joystickEndHandler);
joystickZone.addEventListener('mousedown', joystickStartHandler);
document.addEventListener('mousemove', joystickMoveHandler);
document.addEventListener('mouseup', joystickEndHandler);

// ═══════════════════════════════════════════════════════════
//  الكاميرا — 3rd person + CamControl
// ═══════════════════════════════════════════════════════════

const camControl = document.getElementById('camControl');
const camKnob = document.getElementById('camKnob');
let camActive = false;
let camStart = { x: 0, y: 0 };
let camInput = { x: 0, y: 0 };

let camAzimuth = Math.PI;   // زاوية الكاميرا
let camPitch = 0.3;         // ميل الكاميرا
let camDistance = 12;       // بُعد الكاميرا
let camMode = 'third';      // third / first

function camStartHandler(e) {
  e.preventDefault();
  camActive = true;
  const touch = e.touches ? e.touches[0] : e;
  const rect = camControl.getBoundingClientRect();
  camStart.x = rect.left + rect.width / 2;
  camStart.y = rect.top + rect.height / 2;
  camMoveHandler(e);
}

function camMoveHandler(e) {
  if (!camActive) return;
  e.preventDefault();

  const touch = e.touches ? e.touches[0] : e;
  let dx = touch.clientX - camStart.x;
  let dy = touch.clientY - camStart.y;

  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_JOY_RADIUS) {
    dx = (dx / dist) * MAX_JOY_RADIUS;
    dy = (dy / dist) * MAX_JOY_RADIUS;
  }

  camKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  camInput.x = dx / MAX_JOY_RADIUS;
  camInput.y = dy / MAX_JOY_RADIUS;

  // نحدّث زاوية الكاميرا
  camAzimuth -= camInput.x * 0.06;
  camPitch = Math.max(-0.2, Math.min(0.8, camPitch + camInput.y * 0.05));
}

function camEndHandler(e) {
  camActive = false;
  camKnob.style.transform = 'translate(-50%, -50%)';
  camInput.x = 0;
  camInput.y = 0;
}

camControl.addEventListener('touchstart', camStartHandler, { passive: false });
camControl.addEventListener('touchmove', camMoveHandler, { passive: false });
camControl.addEventListener('touchend', camEndHandler);
camControl.addEventListener('mousedown', camStartHandler);

// ═══════════════════════════════════════════════════════════
//  تحديث موقع الكاميرا
// ═══════════════════════════════════════════════════════════

const camTarget = new THREE.Vector3();

function updateCamera() {
  if (!PLAYER.group) return;

  const px = PLAYER.group.position.x;
  const pz = PLAYER.group.position.z;

  if (camMode === 'first') {
    // منظور أول
    camera.position.set(
      px + Math.sin(camAzimuth) * 0.3,
      2.5,
      pz + Math.cos(camAzimuth) * 0.3
    );
    camera.lookAt(
      px + Math.sin(camAzimuth + Math.PI) * 10,
      2.5 + Math.sin(camPitch) * 5,
      pz + Math.cos(camAzimuth + Math.PI) * 10
    );
  } else {
    // منظور ثالث
    const camX = px + Math.sin(camAzimuth) * camDistance * Math.cos(camPitch);
    const camY = 4 + camDistance * Math.sin(camPitch) + 3;
    const camZ = pz + Math.cos(camAzimuth) * camDistance * Math.cos(camPitch);

    camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.15);
    camTarget.lerp(new THREE.Vector3(px, 2.5, pz), 0.2);
    camera.lookAt(camTarget);
  }
}

// ═══════════════════════════════════════════════════════════

function updatePlayer(dt) {
  if (!PLAYER.group) return;

  // نقراو Joystick
  const joyX = joystickInput.x;
  const joyY = joystickInput.y;

  const joyMag = Math.sqrt(joyX * joyX + joyY * joyY);

  if (joyMag > 0.1) {
    // اتجاه الحركة بالنسبة للكاميرا
    const forward = camAzimuth + Math.PI;
    const angleInput = Math.atan2(joyX, -joyY);

    const moveAngle = forward + angleInput;

    const speed = PLAYER.isRunning ? 12 : 6;
    const moveSpeed = speed * joyMag;

    PLAYER.group.position.x += Math.sin(moveAngle) * moveSpeed * dt;
    PLAYER.group.position.z += Math.cos(moveAngle) * moveSpeed * dt;

    // نحدّثو اتجاه الشخصية
    PLAYER.group.rotation.y = moveAngle;

    // أنيميشن مشي
    PLAYER.walkPhase += dt * (PLAYER.isRunning ? 14 : 8);

    const swing = Math.sin(PLAYER.walkPhase) * 0.6;
    if (PLAYER.legL) PLAYER.legL.rotation.x = swing;
    if (PLAYER.legR) PLAYER.legR.rotation.x = -swing;
    if (PLAYER.armL) PLAYER.armL.rotation.x = -swing * 0.7;
    if (PLAYER.armR) PLAYER.armR.rotation.x = swing * 0.7;

    // اهتزاز بسيط
    PLAYER.group.position.y = Math.abs(Math.sin(PLAYER.walkPhase)) * 0.08;
  } else {
    // إرجاع الأرجل لوضعها
    if (PLAYER.legL) PLAYER.legL.rotation.x *= 0.85;
    if (PLAYER.legR) PLAYER.legR.rotation.x *= 0.85;
    if (PLAYER.armL) PLAYER.armL.rotation.x *= 0.85;
    if (PLAYER.armR) PLAYER.armR.rotation.x *= 0.85;
    PLAYER.group.position.y *= 0.9;
  }

  // حدود العالم
  const limit = HALF - 20;
  PLAYER.group.position.x = Math.max(-limit, Math.min(limit, PLAYER.group.position.x));
  PLAYER.group.position.z = Math.max(-limit, Math.min(limit, PLAYER.group.position.z));
}

// ═══════════════════════════════════════════════════════════
//  التفاعل — اضغط على مبنى قريب
// ═══════════════════════════════════════════════════════════

let currentNearbyBuilding = null;
let currentActivity = null;
let currentTitle = '';

function findNearbyBuilding() {
  if (!PLAYER.group) return null;

  const px = PLAYER.group.position.x;
  const pz = PLAYER.group.position.z;

  let closest = null;
  let closestDist = 999;

  for (const b of landmarks) {
    const dx = px - b.position.x;
    const dz = pz - b.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const radius = (b.userData.radius || 30) + 10;

    if (dist < radius && dist < closestDist) {
      closest = b;
      closestDist = dist;
    }
  }

  return closest;
}

function interactNearby() {
  const nearby = findNearbyBuilding();

  if (nearby) {
    const ud = nearby.userData;
    showPanel(ud.name, ud.desc, ud.activity);
  } else {
    // ما فيهش مبنى قريب
    const px = PLAYER.group.position.x;
    const pz = PLAYER.group.position.z;

    // يمكن نقدر ندخل بيت عادي
    let closestHouse = null;
    let closestHouseDist = 999;

    for (const b of buildingMeshes) {
      if (landmarks.includes(b)) continue;

      const dx = px - b.position.x;
      const dz = pz - b.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      if (dist < 15 && dist < closestHouseDist) {
        closestHouse = b;
        closestHouseDist = dist;
      }
    }

    if (closestHouse) {
      showToast('🏠 مبنى خاص');
    } else {
      showToast('📍 لا يوجد مكان قريب');
    }
  }
}

function showPanel(title, desc, activity) {
  document.getElementById('pTitle').textContent = title;
  document.getElementById('pDesc').textContent = desc || '';
  document.getElementById('pInfo').innerHTML = '';
  currentActivity = activity;
  currentTitle = title;

  document.getElementById('interactPanel').classList.add('show');
}

function closePanel() {
  document.getElementById('interactPanel').classList.remove('show');
}

function openCurrentActivity() {
  if (!currentActivity) {
    closePanel();
    return;
  }

  if (window.AndroidBridge && AndroidBridge.openActivity) {
    AndroidBridge.openActivity(currentActivity);
  } else {
    showToast('⚠️ التنقل غير متاح');
  }

  closePanel();
}

let isNight = false;

function toggleDayNight() {
  isNight = !isNight;

  if (isNight) {
    // ليل
    skyMat.uniforms.topColor.value.setHex(0x0A0E2A);
    skyMat.uniforms.bottomColor.value.setHex(0x1A2A5A);
    scene.fog.color.setHex(0x1A2A5A);
    scene.background = new THREE.Color(0x0A0E2A);

    ambient.intensity = 0.15;
    hemi.intensity = 0.1;
    sun.intensity = 0.15;
    sun.color.setHex(0x88AADD);
    warmLight.intensity = 0.15;

    // نخفي الشمس
    sunMesh.visible = false;

    document.getElementById('btnDayNight').textContent = '☀️';
    showToast('🌙 الوضع الليلي');
  } else {
    // نهار
    skyMat.uniforms.topColor.value.setHex(0x2E6BC8);
    skyMat.uniforms.bottomColor.value.setHex(0xC8E0F0);
    scene.fog.color.setHex(0xB8D9F0);
    scene.background = new THREE.Color(0xB8D9F0);

    ambient.intensity = 0.45;
    hemi.intensity = 0.5;
    sun.intensity = 1.1;
    sun.color.setHex(0xFFF4CC);
    warmLight.intensity = 0.25;

    sunMesh.visible = true;

    document.getElementById('btnDayNight').textContent = '🌙';
    showToast('☀️ الوضع النهاري');
  }
}

// ═══════════════════════════════════════════════════════════
//  إعادة الكاميرا
// ═══════════════════════════════════════════════════════════

function resetCamera() {
  camAzimuth = Math.PI;
  camPitch = 0.3;
  camDistance = 12;
  showToast('🎯 إعادة الكاميرا');
}

// ═══════════════════════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════════════════════

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════════════
//  Minimap
// ═══════════════════════════════════════════════════════════

const minimapCanvas = document.getElementById('minimapCanvas');
const mmCtx = minimapCanvas.getContext('2d');
const MM_SIZE = 100;
const MM_SCALE = MM_SIZE / WORLD;

function drawMinimap() {
  mmCtx.fillStyle = '#1A0F2E';
  mmCtx.fillRect(0, 0, MM_SIZE, MM_SIZE);

  // رسم الطرق
  mmCtx.fillStyle = '#3A3A3A';
  for (const rx of [-300, 0, 300]) {
    mmCtx.fillRect(rx * MM_SCALE + MM_SIZE / 2 - 1, 0, 2, MM_SIZE);
  }
  for (const rz of [-300, 0, 300]) {
    mmCtx.fillRect(0, rz * MM_SCALE + MM_SIZE / 2 - 1, MM_SIZE, 2);
  }

  // رسم المعالم
  for (const lm of landmarks) {
    const x = lm.position.x * MM_SCALE + MM_SIZE / 2;
    const y = lm.position.z * MM_SCALE + MM_SIZE / 2;
    mmCtx.fillStyle = '#D4AF37';
    mmCtx.beginPath();
    mmCtx.arc(x, y, 2.5, 0, Math.PI * 2);
    mmCtx.fill();
  }

  // رسم المباني
  mmCtx.fillStyle = '#8B6F47';
  for (const b of buildingMeshes) {
    if (landmarks.includes(b)) continue;
    const x = b.position.x * MM_SCALE + MM_SIZE / 2;
    const y = b.position.z * MM_SCALE + MM_SIZE / 2;
    mmCtx.fillRect(x - 1, y - 1, 2, 2);
  }

  // رسم اللاعب
  if (PLAYER.group) {
    const x = PLAYER.group.position.x * MM_SCALE + MM_SIZE / 2;
    const y = PLAYER.group.position.z * MM_SCALE + MM_SIZE / 2;

    mmCtx.fillStyle = '#10B981';
    mmCtx.beginPath();
    mmCtx.arc(x, y, 3, 0, Math.PI * 2);
    mmCtx.fill();

    // اتجاه اللاعب
    const angle = PLAYER.group.rotation.y;
    mmCtx.strokeStyle = '#10B981';
    mmCtx.lineWidth = 1.5;
    mmCtx.beginPath();
    mmCtx.moveTo(x, y);
    mmCtx.lineTo(
      x + Math.sin(angle) * 6,
      y + Math.cos(angle) * 6
    );
    mmCtx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════

let lastFrame = performance.now();
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  time += dt;

  // نحدّث الشخصية
  updatePlayer(dt);

  // نحدّث الكاميرا
  updateCamera();

  // نحرّك السيارات
  for (const car of cars) {
    const axis = car.userData.axis;
    const dir = car.userData.dir;
    const speed = car.userData.speed;

    if (axis === 'x') {
      car.position.x += dir * speed * dt;
      if (car.position.x > HALF + 30) car.position.x = -HALF - 30;
      if (car.position.x < -HALF - 30) car.position.x = HALF + 30;
    } else {
      car.position.z += dir * speed * dt;
      if (car.position.z > HALF + 30) car.position.z = -HALF - 30;
      if (car.position.z < -HALF - 30) car.position.z = HALF + 30;
    }
  }

  // نحرّك المواطنين
  for (const c of citizens) {
    const speed = c.userData.speed;
    const angle = c.userData.angle;

    c.position.x += Math.cos(angle) * speed * dt;
    c.position.z += Math.sin(angle) * speed * dt;

    // نغيّر الاتجاه عشوائياً
    c.userData.angle += (Math.random() - 0.5) * 0.4 * dt;

    // حدود
    const limit = HALF - 30;
    if (c.position.x > limit || c.position.x < -limit ||
        c.position.z > limit || c.position.z < -limit) {
      c.userData.angle += Math.PI;
    }

    // أنيميشن مشي
    c.userData.walkPhase += dt * 6;
    const swing = Math.sin(c.userData.walkPhase) * 0.35;

    if (c.userData.legL) c.userData.legL.rotation.x = swing;
    if (c.userData.legR) c.userData.legR.rotation.x = -swing;
    if (c.userData.armL) c.userData.armL.rotation.x = -swing * 0.8;
    if (c.userData.armR) c.userData.armR.rotation.x = swing * 0.8;

    c.position.y = 0.4 + Math.abs(Math.sin(c.userData.walkPhase)) * 0.05;
  }

  // نرسم Minimap
  drawMinimap();

  renderer.render(scene, camera);
}
