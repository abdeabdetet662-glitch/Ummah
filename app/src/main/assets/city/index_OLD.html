<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مدينة أُمّة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
  canvas { display: block; touch-action: none; }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #D4AF37; font-size: 15px; text-align: center; z-index: 100;
    background: rgba(10,5,16,0.95); padding: 30px 40px; border-radius: 20px;
    border: 2px solid #D4AF37; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2); border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #info {
    position: absolute; top: 16px; right: 16px;
    background: rgba(10,5,16,0.9); color: #D4AF37;
    padding: 10px 16px; border-radius: 12px; font-size: 12px; z-index: 50;
    border: 1px solid rgba(212,175,55,0.4); backdrop-filter: blur(10px);
  }
  #info .num { color: #FFD700; font-weight: bold; font-size: 14px; }
  #controls {
    position: absolute; top: 16px; left: 16px;
    display: flex; flex-direction: column; gap: 8px; z-index: 50;
  }
  #controls button {
    background: rgba(10,5,16,0.9); color: #D4AF37;
    border: 1px solid rgba(212,175,55,0.5);
    padding: 10px 14px; border-radius: 10px; font-size: 16px;
    cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s;
  }
  #controls button:active { transform: scale(0.95); background: rgba(212,175,55,0.2); }
  #plotPanel {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); z-index: 200;
    display: none; align-items: flex-end; backdrop-filter: blur(6px);
  }
  #plotPanel.show { display: flex; }
  #plotPanel .panel {
    width: 100%; background: linear-gradient(180deg, #1A0F2E, #0A0510);
    border-top-left-radius: 28px; border-top-right-radius: 28px;
    border-top: 3px solid #D4AF37; padding: 24px 22px 40px;
    animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 80vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #plotPanel h3 { color: #D4AF37; font-size: 22px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  #plotPanel .coords { color: #9CA3AF; font-size: 12px; margin-bottom: 18px; }
  #plotPanel .info-row {
    color: #F5F5F5; font-size: 14px; padding: 10px 0;
    border-bottom: 1px solid rgba(212,175,55,0.15);
    display: flex; justify-content: space-between; align-items: center;
  }
  #plotPanel .info-row:last-of-type { border-bottom: none; }
  #plotPanel .info-row b { color: #D4AF37; }
  #plotPanel .btns { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  #plotPanel button {
    flex: 1; min-width: 100px; padding: 15px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer;
    transition: transform 0.15s;
  }
  #plotPanel button:active { transform: scale(0.96); }
  #plotPanel .btn-open { background: linear-gradient(135deg, #FFD700, #D4AF37); color: #0A0510; }
  #plotPanel .btn-close { background: #2A1535; color: #F5F5F5; }
  #plotPanel .price { color: #FFD700; font-size: 26px; font-weight: bold; margin: 14px 0; }
  .toast {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(10,5,16,0.96); color: #D4AF37;
    padding: 14px 26px; border-radius: 14px; border: 2px solid #D4AF37;
    font-size: 14px; z-index: 300; display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); max-width: 85%;
  }
  .toast.show { display: block; animation: toastIn 0.3s ease-out; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  #hud {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 20px 24px;
    background: linear-gradient(to top, rgba(10,5,16,0.95), rgba(10,5,16,0));
    color: #D4AF37; font-size: 12px; z-index: 50;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>🏙️ جاري بناء مدينة أُمّة...</div></div>
<div id="info"><span>🏙️</span> مبانٍ: <span class="num" id="buildingCount">0</span> • معالم: <span class="num" id="landmarkCount">0</span></div>
<div id="controls">
  <button onclick="toggleDayNight()" title="النهار/الليل">🌙</button>
  <button onclick="resetCamera()" title="إعادة">🎯</button>
  <button onclick="toggleRotate()" title="دوران">🔄</button>
</div>
<div id="plotPanel">
  <div class="panel">
    <h3 id="pTitle">📍 مكان</h3>
    <div class="coords" id="pCoords"></div>
    <div id="pContent"></div>
    <div class="btns" id="pBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="hud"><span>👆</span><span>اسحب للتدوير • قرّب بإصبعين • اضغط مبنى</span></div>
<script src="../avatar/libs/three.min.js"></script>
<script src="../avatar/libs/OrbitControls.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  الإعدادات العامة
// ═══════════════════════════════════════════════════════════

const WORLD = 700;
const HALF = WORLD / 2;

// ═══════════════════════════════════════════════════════════
//  Scene + Camera + Renderer
// ═══════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xB8D9F0, 800, 2200);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(220, 180, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 40;
controls.maxDistance = 1200;
controls.maxPolarAngle = Math.PI / 2.15;
controls.target.set(0, 20, 0);

// ═══════════════════════════════════════════════════════════
//  الإضاءة
// ═══════════════════════════════════════════════════════════

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xB8D9F0, 0x4A7C3F, 0.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF4CC, 1.15);
sun.position.set(300, 500, 250);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 1500;
sun.shadow.camera.left = -600;
sun.shadow.camera.right = 600;
sun.shadow.camera.top = 600;
sun.shadow.camera.bottom = -600;
sun.shadow.bias = -0.0004;
scene.add(sun);

// ═══════════════════════════════════════════════════════════
//  السماء
// ═══════════════════════════════════════════════════════════

const skyGeo = new THREE.SphereGeometry(2500, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x2E6BC8) },
    bottomColor: { value: new THREE.Color(0xC8E0F0) },
    offset: { value: 300 },
    exponent: { value: 0.75 }
  },
  vertexShader: 'varying vec3 vWorldPos; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }',
  fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPos; void main() { float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y; float f = max(pow(max(h, 0.0), exponent), 0.0); gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0); }'
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ═══════════════════════════════════════════════════════════
//  الأرض والبحر
// ═══════════════════════════════════════════════════════════

const groundMat = new THREE.MeshLambertMaterial({ color: 0x5A9B4A });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const seaMat = new THREE.MeshLambertMaterial({ color: 0x2E7BB8, transparent: true, opacity: 0.85 });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(1500, 400), seaMat);
sea.rotation.x = -Math.PI / 2;
sea.position.set(0, 0.3, -HALF - 180);
scene.add(sea);

const foamMat = new THREE.MeshLambertMaterial({ color: 0xF0F0E8 });
const foam = new THREE.Mesh(new THREE.PlaneGeometry(1500, 8), foamMat);
foam.rotation.x = -Math.PI / 2;
foam.position.set(0, 0.4, -HALF - 20);
scene.add(foam);

const sandMat = new THREE.MeshLambertMaterial({ color: 0xE8D4A8 });
const sand = new THREE.Mesh(new THREE.PlaneGeometry(WORLD + 100, 60), sandMat);
sand.rotation.x = -Math.PI / 2;
sand.position.set(0, 0.35, -HALF - 10);
scene.add(sand);

// ═══════════════════════════════════════════════════════════
//  الطرق
// ═══════════════════════════════════════════════════════════

const roadMat = new THREE.MeshLambertMaterial({ color: 0x2A2A2A });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xA8A29A });
const lineMat = new THREE.MeshBasicMaterial({ color: 0xFFEB3B });

function makeRoad(cx, cz, w, d, horizontal) {
  const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(w + 8, 0.6, d + 8), sidewalkMat);
  sidewalk.position.set(cx, 0.35, cz);
  sidewalk.receiveShadow = true;
  scene.add(sidewalk);

  const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.85, d), roadMat);
  road.position.set(cx, 0.4, cz);
  road.receiveShadow = true;
  scene.add(road);

  const length = horizontal ? w : d;
  const lineCount = Math.floor(length / 10);
  for (let i = 0; i < lineCount; i += 2) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(horizontal ? 5 : 0.5, 0.1, horizontal ? 0.5 : 5),
      lineMat
    );
    const off = -length / 2 + 5 + i * 10;
    line.position.set(horizontal ? cx + off : cx, 0.9, horizontal ? cz : cz + off);
    scene.add(line);
  }
}

const ROAD_W = 16;
for (let i = -2; i <= 2; i++) {
  makeRoad(0, i * (WORLD / 5), WORLD, ROAD_W, true);
}
for (let i = -2; i <= 2; i++) {
  makeRoad(i * (WORLD / 5), 0, ROAD_W, WORLD, false);
}

// ═══════════════════════════════════════════════════════════
//  الساحة المركزية + النافورة
// ═══════════════════════════════════════════════════════════

const plazaSize = 90;
const plazaMat = new THREE.MeshLambertMaterial({ color: 0xE8DCC8 });
const plaza = new THREE.Mesh(new THREE.BoxGeometry(plazaSize, 0.8, plazaSize), plazaMat);
plaza.position.y = 0.4;
plaza.receiveShadow = true;
scene.add(plaza);

const mosaicMat = new THREE.MeshLambertMaterial({ color: 0xD4AF37 });
const mosaic1 = new THREE.Mesh(new THREE.CylinderGeometry(30, 30, 0.85, 32), mosaicMat);
mosaic1.position.y = 0.42;
scene.add(mosaic1);

const mosaic2 = new THREE.Mesh(new THREE.CylinderGeometry(25, 25, 0.86, 32), plazaMat);
mosaic2.position.y = 0.43;
scene.add(mosaic2);

const mosaic3 = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 0.87, 32), mosaicMat);
mosaic3.position.y = 0.44;
scene.add(mosaic3);

function makeFountain() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 1.2, 32),
    new THREE.MeshLambertMaterial({ color: 0xE8DCC8 }));
  base.position.y = 0.6; base.castShadow = true; base.receiveShadow = true;
  g.add(base);

  const water = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 8.5, 0.8, 32),
    new THREE.MeshLambertMaterial({ color: 0x4FC3F7, transparent: true, opacity: 0.85 }));
  water.position.y = 1.2;
  g.add(water);

  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4, 12),
    new THREE.MeshLambertMaterial({ color: 0xE8DCC8 }));
  pillar.position.y = 3; pillar.castShadow = true;
  g.add(pillar);

  const top = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 12),
    new THREE.MeshLambertMaterial({ color: 0xD4AF37 }));
  top.position.y = 5.5; top.castShadow = true;
  g.add(top);

  g.position.y = 0.8;
  return g;
}
scene.add(makeFountain());

// ═══════════════════════════════════════════════════════════
//  الأشجار
// ═══════════════════════════════════════════════════════════

const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
const trunkDarkMat = new THREE.MeshLambertMaterial({ color: 0x3E2723 });
const leafMats = [
  new THREE.MeshLambertMaterial({ color: 0x2E7D32 }),
  new THREE.MeshLambertMaterial({ color: 0x388E3C }),
  new THREE.MeshLambertMaterial({ color: 0x43A047 }),
  new THREE.MeshLambertMaterial({ color: 0x4CAF50 }),
  new THREE.MeshLambertMaterial({ color: 0x66BB6A })
];

function makeTree(variant) {
  const g = new THREE.Group();
  const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];

  if (variant === 'palm') {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 10, 8), trunkMat);
    trunk.position.y = 5; trunk.castShadow = true;
    g.add(trunk);
    for (let i = 0; i < 8; i++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.8, 5, 4), leafMat);
      leaf.position.y = 10;
      leaf.rotation.z = Math.PI / 2.5;
      leaf.rotation.y = (i / 8) * Math.PI * 2;
      leaf.position.x = Math.cos((i / 8) * Math.PI * 2) * 2;
      leaf.position.z = Math.sin((i / 8) * Math.PI * 2) * 2;
      leaf.castShadow = true;
      g.add(leaf);
    }
  } else if (variant === 'pine') {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), trunkDarkMat);
    trunk.position.y = 1.5; trunk.castShadow = true;
    g.add(trunk);
    for (let i = 0; i < 3; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(3 - i * 0.7, 4, 8), leafMat);
      cone.position.y = 3.5 + i * 2; cone.castShadow = true;
      g.add(cone);
    }
  } else {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), trunkMat);
    trunk.position.y = 1.5; trunk.castShadow = true;
    g.add(trunk);
    const l1 = new THREE.Mesh(new THREE.SphereGeometry(2.4, 8, 6), leafMat);
    l1.position.y = 4.2; l1.castShadow = true;
    g.add(l1);
    const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 6), leafMat);
    l2.position.set(1, 5.5, 0.5); l2.castShadow = true;
    g.add(l2);
    const l3 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 6), leafMat);
    l3.position.set(-0.8, 5.2, -0.7); l3.castShadow = true;
    g.add(l3);
  }
  return g;
}

// ═══════════════════════════════════════════════════════════
//  أعمدة الإضاءة
// ═══════════════════════════════════════════════════════════

const lampPoleMat = new THREE.MeshLambertMaterial({ color: 0x3A3A3A });
const lampGlowMat = new THREE.MeshLambertMaterial({
  color: 0xFFF4CC, emissive: 0xFFF4CC, emissiveIntensity: 0.8
});

function makeStreetLamp() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, 7, 8), lampPoleMat);
  pole.position.y = 3.5; pole.castShadow = true;
  g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.15, 0.15), lampPoleMat);
  arm.position.set(0.75, 7, 0);
  g.add(arm);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), lampGlowMat);
  head.position.set(1.5, 7, 0);
  g.add(head);
  return g;
}

// ═══════════════════════════════════════════════════════════
//  السيارات
// ═══════════════════════════════════════════════════════════

const carColors = [0xE53935, 0x1E88E5, 0x43A047, 0xFDD835, 0x8E24AA, 0xFB8C00, 0xF5F5F5, 0x212121, 0x00ACC1];
const cars = [];

function makeCar() {
  const g = new THREE.Group();
  const color = carColors[Math.floor(Math.random() * carColors.length)];
  const bodyMat = new THREE.MeshLambertMaterial({ color });

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 5), bodyMat);
  body.position.y = 0.9; body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2.6),
    new THREE.MeshLambertMaterial({ color: 0x1A1A1A }));
  cabin.position.y = 1.75; cabin.position.z = -0.2; cabin.castShadow = true;
  g.add(cabin);

  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1A1A1A });
  const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.35, 12);
  for (let x of [-1.25, 1.25]) {
    for (let z of [-1.6, 1.6]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, 0.55, z);
      w.castShadow = true;
      g.add(w);
    }
  }

  const lightMat = new THREE.MeshBasicMaterial({ color: 0xFFEB3B });
  const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.1), lightMat);
  lightL.position.set(-0.7, 1, 2.55);
  g.add(lightL);
  const lightR = lightL.clone();
  lightR.position.x = 0.7;
  g.add(lightR);

  g.userData.speed = 0.4 + Math.random() * 0.4;
  return g;
}

// ═══════════════════════════════════════════════════════════
//  المواطنون
// ═══════════════════════════════════════════════════════════

const citizenColors = [0xE53935, 0x1E88E5, 0x43A047, 0xFDD835, 0x8E24AA, 0xFB8C00, 0x26C6DA, 0xFF7043, 0xEC407A];
const skinColors = [0xFFCC99, 0xE0AC69, 0xC68642, 0x8D5524];
const citizens = [];

function makeCitizen() {
  const g = new THREE.Group();
  const color = citizenColors[Math.floor(Math.random() * citizenColors.length)];
  const skin = skinColors[Math.floor(Math.random() * skinColors.length)];

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 8),
    new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.7; body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 8),
    new THREE.MeshLambertMaterial({ color: skin }));
  head.position.y = 1.8; head.castShadow = true;
  g.add(head);

  const legMat = new THREE.MeshLambertMaterial({ color: 0x212121 });
  const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);

  const legL = new THREE.Mesh(legGeo, legMat);
  legL.position.set(-0.2, 0.4, 0);
  legL.castShadow = true;
  g.add(legL);

  const legR = new THREE.Mesh(legGeo, legMat);
  legR.position.set(0.2, 0.4, 0);
  legR.castShadow = true;
  g.add(legR);

  g.userData.speed = 0.08 + Math.random() * 0.08;
  g.userData.angle = Math.random() * Math.PI * 2;
  g.userData.legL = legL;
  g.userData.legR = legR;
  g.userData.walkPhase = Math.random() * Math.PI * 2;

  return g;
}

// ═══════════════════════════════════════════════════════════
//  القوارب
// ═══════════════════════════════════════════════════════════

const boats = [];

function makeBoat() {
  const g = new THREE.Group();

  const hull = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 10),
    new THREE.MeshLambertMaterial({ color: 0xA0522D }));
  hull.position.y = 0.6; hull.castShadow = true;
  g.add(hull);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 9.5),
    new THREE.MeshLambertMaterial({ color: 0xD2B48C }));
  deck.position.y = 1.3;
  g.add(deck);

  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 10, 8),
    new THREE.MeshLambertMaterial({ color: 0x5D4037 }));
  mast.position.y = 6; mast.castShadow = true;
  g.add(mast);

  const sail = new THREE.Mesh(new THREE.PlaneGeometry(5, 7),
    new THREE.MeshLambertMaterial({ color: 0xF5F5F5, side: THREE.DoubleSide }));
  sail.position.set(2.5, 7, 0);
  g.add(sail);

  g.userData.speed = 0.03 + Math.random() * 0.03;
  return g;
}

// ═══════════════════════════════════════════════════════════
//  أنماط المباني — ألوان متنوعة
// ═══════════════════════════════════════════════════════════

const WALL_MATS = [
  new THREE.MeshLambertMaterial({ color: 0xD8D4C8 }),
  new THREE.MeshLambertMaterial({ color: 0xC4B898 }),
  new THREE.MeshLambertMaterial({ color: 0xE8D8A8 }),
  new THREE.MeshLambertMaterial({ color: 0xA0503A }),
  new THREE.MeshLambertMaterial({ color: 0xD8B888 }),
  new THREE.MeshLambertMaterial({ color: 0xB89068 }),

  new THREE.MeshLambertMaterial({ color: 0x88A8C8 }),

];

const ROOF_MATS = [
  new THREE.MeshLambertMaterial({ color: 0x8B3A2A }),
  new THREE.MeshLambertMaterial({ color: 0x5A5A5A }),
  new THREE.MeshLambertMaterial({ color: 0x6B3A28 }),
  new THREE.MeshLambertMaterial({ color: 0x4A4A5A }),
  new THREE.MeshLambertMaterial({ color: 0x7A5A3A })
];

const WINDOW_MAT = new THREE.MeshLambertMaterial({
  color: 0x87CEEB, emissive: 0x2A4A6A, emissiveIntensity: 0.4
});

const DOOR_MAT = new THREE.MeshLambertMaterial({ color: 0x5A3A28 });

function addWindows(parent, w, h, d, floors) {
  const colsFront = Math.max(2, Math.floor(w / 2.8));
  const rows = floors;
  const wW = 1.0, wH = 1.2;
  const startX = -w / 2 + 1.8;

  for (let f = 0; f < rows; f++) {
    const y = 1.8 + f * 3.2;
    for (let c = 0; c < colsFront; c++) {
      const x = startX + c * ((w - 3.6) / colsFront) + 1;

      const win1 = new THREE.Mesh(new THREE.BoxGeometry(wW, wH, 0.1), WINDOW_MAT);
      win1.position.set(x, y, d / 2 + 0.06);
      parent.add(win1);

      const win2 = win1.clone();
      win2.position.z = -d / 2 - 0.06;
      parent.add(win2);
    }
  }

  const colsSide = Math.max(2, Math.floor(d / 2.8));
  for (let f = 0; f < rows; f++) {
    const y = 1.8 + f * 3.2;
    for (let c = 0; c < colsSide; c++) {
      const z = -d / 2 + 1.8 + c * ((d - 3.6) / colsSide) + 1;

      const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, wH, wW), WINDOW_MAT);
      win1.position.set(w / 2 + 0.06, y, z);
      parent.add(win1);

      const win2 = win1.clone();
      win2.position.x = -w / 2 - 0.06;
      parent.add(win2);
    }
  }
}

// ═══════════════════════════════════════════════════════════

function makeRandomBuilding() {
  const g = new THREE.Group();
  const wallMat = WALL_MATS[Math.floor(Math.random() * WALL_MATS.length)];
  const roofMat = ROOF_MATS[Math.floor(Math.random() * ROOF_MATS.length)];
  const r = Math.random();

  if (r < 0.4) {
    // بيت صغير
    const w = 10, h = 6 + Math.random() * 3, d = 10;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.75, 4, 4), roofMat);
    roof.position.y = h + 2;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    g.add(roof);

    addWindows(g, w, h, d, Math.floor(h / 3));
  } else if (r < 0.7) {
    // مبنى متوسط
    const w = 12, h = 10 + Math.random() * 5, d = 12;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    const roofTop = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.5, d + 1), roofMat);
    roofTop.position.y = h + 0.25;
    roofTop.castShadow = true;
    g.add(roofTop);

    addWindows(g, w, h, d, Math.floor(h / 3));
  } else if (r < 0.9) {
    // برج
    const w = 10, h = 20 + Math.random() * 15, d = 10;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: 0x78909C }));
    box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    addWindows(g, w, h, d, Math.floor(h / 3));

    const top = new THREE.Mesh(new THREE.ConeGeometry(3, 5, 4),
      new THREE.MeshLambertMaterial({ color: 0xD4AF37 }));
    top.position.y = h + 2.5;
    top.castShadow = true;
    g.add(top);
  } else {
    // بيت بأعمدة
    const w = 14, h = 8, d = 12;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
    g.add(box);

    const roofTop = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.6, d + 1), roofMat);
    roofTop.position.y = h + 0.3;
    roofTop.castShadow = true;
    g.add(roofTop);

    addWindows(g, w, h, d, 3);

    // أعمدة
    for (let x of [-1, 1]) {
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, h, 8),
        new THREE.MeshLambertMaterial({ color: 0xE8DCC8 }));
      col.position.set(x * (w / 2 - 1), h / 2, d / 2 - 0.5);
      col.castShadow = true;
      g.add(col);
    }
  }

  return g;
}

// ═══════════════════════════════════════════════════════════
//  التفاعل — Raycasting
// ═══════════════════════════════════════════════════════════

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos.x = e.clientX;
  downPos.y = e.clientY;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dx = e.clientX - downPos.x;
  const dy = e.clientY - downPos.y;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return;

  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  // نبني قائمة قابلة للضغط
  const clickable = [];
  for (const lm of landmarks) clickable.push(lm);
  for (const b of buildingMeshes) {
    if (!landmarks.includes(b)) clickable.push(b);
  }

  const hits = raycaster.intersectObjects(clickable, true);

  if (hits.length > 0) {
    // نطلع للـ parent اللي فيه userData
    let obj = hits[0].object;
    while (obj && !obj.userData.landmark && obj.parent !== scene) {
      obj = obj.parent;
    }
    if (obj && obj.userData.landmark) {
      showLandmarkPanel(obj.userData);
    }
  }
});

function showLandmarkPanel(data) {
  const panel = document.getElementById('plotPanel');
  const title = document.getElementById('pTitle');
  const content = document.getElementById('pContent');
  const btns = document.getElementById('pBtns');

  title.textContent = data.name || '🏢 مبنى';
  document.getElementById('pCoords').textContent = 'المدينة المركزية';

  content.innerHTML = `
    <div class="info-row"><span>النوع</span><b>مبنى حكومي</b></div>
    <div class="info-row"><span>الحالة</span><b style="color:#10B981">مفتوح ✓</b></div>
    <div class="info-row"><span>الوصول</span><b>جميع المواطنين</b></div>
  `;

  btns.innerHTML = `
    <button class="btn-close" onclick="closePanel()">إغلاق</button>
    <button class="btn-open" onclick="openActivity('${data.activity}')">🚪 ادخل</button>
  `;

  panel.classList.add('show');
}

function closePanel() {
  document.getElementById('plotPanel').classList.remove('show');
}

function openActivity(name) {
  closePanel();
  if (window.AndroidBridge && AndroidBridge.openActivity) {
    AndroidBridge.openActivity(name);

    showToast('⚠️ التنقل غير متاح');

}

// ═══════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════

let time = 0;
let lastFrame = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  time += dt;

  // السيارات
  for (const car of cars) {
    const axis = car.userData.axis;
    const dir = car.userData.dir || 1;
    const speed = car.userData.speed * 60;

    if (axis === 'x') {
      car.position.x += dir * speed * dt;
      if (car.position.x > HALF + 30) car.position.x = -HALF - 30;
      if (car.position.x < -HALF - 30) car.position.x = HALF + 30;
    } else {
      car.position.z += dir * speed * dt;
      if (car.position.z > HALF + 30) car.position.z = -HALF - 30;
      if (car.position.z < -HALF - 30) car.position.z = HALF + 30;
    }
  }

  // المواطنون
  for (const c of citizens) {
    const speed = c.userData.speed * 60;
    const angle = c.userData.angle;
    c.position.x += Math.cos(angle) * speed * dt;
    c.position.z += Math.sin(angle) * speed * dt;

    c.userData.angle += (Math.random() - 0.5) * 0.5 * dt;

    const limit = HALF - 30;
    if (c.position.x > limit || c.position.x < -limit ||
        c.position.z > limit || c.position.z < -limit) {
      c.userData.angle += Math.PI;
    }

    // أنيميشن مشي
    c.userData.walkPhase += dt * 6;
    const swing = Math.sin(c.userData.walkPhase) * 0.4;
    if (c.userData.legL) c.userData.legL.rotation.x = swing;
    if (c.userData.legR) c.userData.legR.rotation.x = -swing;

    // اهتزاز خفيف
    c.position.y = 0.4 + Math.abs(Math.sin(c.userData.walkPhase)) * 0.06;
  }

  // القوارب
  for (const boat of boats) {
    const speed = boat.userData.speed * 60;
    boat.position.x += speed * dt;
    boat.position.y = Math.sin(time + boat.position.x * 0.01) * 0.5;
    if (boat.position.x > 800) boat.position.x = -800;
  }

  controls.update();
  renderer.render(scene, camera);
}
