<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عملية سرية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ Canvas ═══ -->
<canvas id="game"></canvas>

<!-- ═══ Loading Screen ═══ -->
<div id="loading" class="screen">
  <div class="loading-crown">🕵️</div>
  <div class="loading-title">عملية سرية</div>
  <div class="loading-bar"><span></span></div>
  <div class="loading-sub">جاري التحميل...</div>
</div>

<!-- ═══ Briefing Screen ═══ -->
<div id="briefing" class="screen hidden">
  <div class="briefing-header">
    <div class="badge-top-secret">🔴 TOP SECRET</div>
    <div class="briefing-title">📋 إحاطة المهمة</div>
  </div>
  <div class="briefing-content">
    <div class="mission-name" id="briefing-mission"></div>
    <div class="mission-story" id="briefing-story"></div>
    <div class="mission-objectives">
      <div class="obj-title">🎯 الأهداف:</div>
      <div class="obj-list" id="briefing-objectives"></div>
    </div>
    <div class="agents-list" id="briefing-agents"></div>
    <div class="warning-box">
      ⚠️ تحذير: <span class="warning-text">أحد أعضاء الفريق قد يكون خائناً</span>
    </div>
  </div>
  <button class="btn-primary" onclick="startMission()">🎬 ابدأ المهمة</button>
</div>

<!-- ═══ HUD ═══ -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="phase-indicator">
      <span id="phase-icon">🔫</span>
      <span id="phase-name">المرحلة 1</span>
    </div>
    <div class="objective-indicator">
      <span id="objective-text">اقضِ على الأعداء</span>
    </div>
    <div class="timer-indicator" id="timer">04:00</div>
  </div>
  
  <div class="hud-bottom-left">
    <div class="health-bar">
      <div class="health-icon">❤️</div>
      <div class="health-bar-bg">
        <div class="health-bar-fill" id="health-fill"></div>
      </div>
      <div class="health-text" id="health-text">100</div>
    </div>
    <div class="ammo-bar">
      <div class="ammo-icon">🔫</div>
      <div class="ammo-text"><span id="ammo-current">30</span>/<span id="ammo-max">30</span></div>
    </div>
  </div>
  
  <div class="hud-top-right">
    <div class="kill-counter">
      <span class="kill-icon">💀</span>
      <span id="kill-count">0</span>
      <span class="kill-max">/ <span id="kill-total">15</span></span>
    </div>
  </div>
</div>

<!-- ═══ Joystick ═══ -->
<div id="joystick" class="hidden">
  <div class="joystick-base">
    <div class="joystick-knob"></div>
  </div>
</div>

<!-- ═══ Actions ═══ -->
<div id="actions" class="hidden">
  <div class="action-btn shoot" id="btn-shoot">
    <span>🔥</span>
  </div>
  <div class="action-btn reload" id="btn-reload">
    <span>🔄</span>
  </div>
  <div class="action-btn weapon" id="btn-weapon">
    <span id="weapon-icon">🏹</span>
  </div>
</div>

<!-- ═══ Puzzle Overlay ═══ -->
<div id="puzzle" class="overlay hidden">
  <div class="puzzle-card">
    <div class="puzzle-header">
      <span class="puzzle-icon">🧩</span>
      <span class="puzzle-title" id="puzzle-title">لغز</span>
    </div>
    <div class="puzzle-content" id="puzzle-content"></div>
    <div class="puzzle-timer" id="puzzle-timer">⏰ 30</div>
  </div>
</div>

<!-- ═══ Investigation Screen ═══ -->
<div id="investigation" class="screen hidden">
  <div class="inv-header">
    <div class="inv-title">🔍 التحقيق</div>
    <div class="inv-sub">اسأل العملاء وابحث عن الخائن</div>
  </div>
  <div class="inv-agents" id="inv-agents"></div>
  <div class="inv-chat" id="inv-chat"></div>
  <div class="inv-questions" id="inv-questions"></div>
  <div class="inv-timer">⏰ <span id="inv-timer">04:00</span></div>
</div>

<!-- ═══ Voting Screen ═══ -->
<div id="voting" class="screen hidden">
  <div class="vote-header">
    <div class="vote-title">🗳️ من هو الخائن؟</div>
    <div class="vote-sub">صوّت للعميل الذي تشك فيه</div>
  </div>
  <div class="vote-agents" id="vote-agents"></div>
  <div class="vote-status" id="vote-status"></div>
</div>

<!-- ═══ Result Screen ═══ -->
<div id="result" class="screen hidden">
  <div class="result-container">
    <div class="result-icon" id="result-icon">🏆</div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-reveal" id="result-reveal"></div>
    <div class="result-stats" id="result-stats"></div>
    <button class="btn-primary" onclick="exitGame()">🚪 الخروج</button>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div id="toast" class="toast hidden"></div>

<script src="js/missions.js"></script>
<script src="js/levels.js"></script>
<script src="js/investigation.js"></script>
<script src="js/game.js"></script>
</body>
</html>
