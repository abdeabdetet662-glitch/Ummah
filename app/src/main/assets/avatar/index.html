<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avatar 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #0B4F2C 0%, #0A0A0A 70%); }
  canvas { display: block; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #D4AF37; font-family: sans-serif; font-size: 18px;
    text-align: center; z-index: 10;
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2);
    border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  ⏳ جاري التحميل
</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/GLTFLoader.js"></script>
<script src="./libs/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls;
let avatarRoot = null;
let mixer = null;
let clock;

init();
animate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // الإضاءة
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));

  const keyLight = new THREE.DirectionalLight(0xFFD97A, 2.0);
  keyLight.position.set(3, 6, 4);
  keyLight.castShadow = true;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x4A90E2, 0.7);
  fillLight.position.set(-4, 3, 2);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xD4AF37, 1.0);
  rimLight.position.set(0, 4, -5);
  scene.add(rimLight);

  // أرضية
  const groundGeom = new THREE.CircleGeometry(2.5, 32);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0B4F2C, emissive: 0x0B4F2C, emissiveIntensity: 0.2,
    metalness: 0.4, roughness: 0.8
  });
  const ground = new THREE.Mesh(groundGeom, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 6;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI / 1.9;
  controls.minPolarAngle = Math.PI / 4;

  clock = new THREE.Clock();
  loadAvatar();
}

function loadAvatar() {
  const loader = new THREE.GLTFLoader();
  const modelUrl = './models/soldier.glb';

  loader.load(
    modelUrl,
    function(gltf) {
      avatarRoot = gltf.scene;

      avatarRoot.traverse(function(child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      const box = new THREE.Box3().setFromObject(avatarRoot);
      const size = box.getSize(new THREE.Vector3());
      const targetHeight = 1.8;
      const scale = targetHeight / size.y;
      avatarRoot.scale.setScalar(scale);

      const newBox = new THREE.Box3().setFromObject(avatarRoot);
      avatarRoot.position.y = -newBox.min.y;

      scene.add(avatarRoot);

      const finalBox = new THREE.Box3().setFromObject(avatarRoot);
      const center = finalBox.getCenter(new THREE.Vector3());
      const height = finalBox.max.y - finalBox.min.y;

      const dist = height * 2.2;
      camera.position.set(0, center.y + height * 0.15, dist);
      camera.lookAt(center.x, center.y, center.z);

      controls.target.set(center.x, center.y, center.z);
      controls.update();

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatarRoot);
        let idle = null;
        for (let i = 0; i < gltf.animations.length; i++) {
          if (gltf.animations[i].name.toLowerCase().indexOf('idle') >= 0) {
            idle = gltf.animations[i];
            break;
          }
        }
        if (!idle) idle = gltf.animations[0];
        if (idle) mixer.clipAction(idle).play();
      }

      document.getElementById('loading').style.display = 'none';
    },
    function(progress) {
      let txt = '⏳ جاري التحميل';
      if (progress.total > 0) {
        const pct = Math.min(100, Math.round((progress.loaded / progress.total) * 100));
        txt = '⏳ ' + pct + '%';
      } else if (progress.loaded > 0) {
        txt = '⏳ ' + Math.round(progress.loaded / 1024) + ' KB';
      }
      document.getElementById('loading').innerHTML = '<div class="spinner"></div>' + txt;
    },
    function(error) {
      console.error(error);
      document.getElementById('loading').innerHTML = '❌ فشل التحميل';
    }
  );
}

window.setShirtColor = function(hex) {
  if (!avatarRoot) return;
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material) {
      const n = ((child.name || '') + ' ' + (child.material.name || '')).toLowerCase();
      if (n.indexOf('shirt') >= 0 || n.indexOf('torso') >= 0 || n.indexOf('chest') >= 0 ||
          n.indexOf('uniform') >= 0 || n.indexOf('body') >= 0 || n.indexOf('jacket') >= 0) {
        child.material.color.set(hex);
      }
    }
  });
};

window.setPantsColor = function(hex) {
  if (!avatarRoot) return;
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material) {
      const n = ((child.name || '') + ' ' + (child.material.name || '')).toLowerCase();
      if (n.indexOf('pant') >= 0 || n.indexOf('leg') >= 0 || n.indexOf('trouser') >= 0) {
        child.material.color.set(hex);
      }
    }
  });
};

window.setSkinColor = function(hex) {
  if (!avatarRoot) return;
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material) {
      const n = ((child.name || '') + ' ' + (child.material.name || '')).toLowerCase();
      if (n.indexOf('head') >= 0 || n.indexOf('face') >= 0 || n.indexOf('skin') >= 0 ||
          n.indexOf('hand') >= 0 || n.indexOf('arm') >= 0) {
        child.material.color.set(hex);
      }
    }
  });
};

window.applyColors = function(colors) {
  if (colors.shirt) window.setShirtColor(colors.shirt);
  if (colors.pants) window.setPantsColor(colors.pants);
  if (colors.skin) window.setSkinColor(colors.skin);
};

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
