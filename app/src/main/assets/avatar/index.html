<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avatar 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #0B4F2C 0%, #0A0A0A 70%); }
  canvas { display: block; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #D4AF37; font-family: sans-serif; font-size: 18px;
    text-align: center; z-index: 10;
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2);
    border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  ⏳ جاري تحميل الشخصية
</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/GLTFLoader.js"></script>
<script src="./libs/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls;
let avatarRoot = null;
let mixer = null;
let clock;

// ملابس 3D
let shirtMesh = null;
let pantsMesh = null;
let hatMesh = null;
let glassesMesh = null;
let phoneMesh = null;
let shoesMeshes = [];

// مواد الملابس
let shirtMat, pantsMat, shoesMat, hatMat, glassesMat, phoneMat;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // الإضاءة
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const keyLight = new THREE.DirectionalLight(0xFFD97A, 2.2);
  keyLight.position.set(3, 6, 4);
  keyLight.castShadow = true;
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x4A90E2, 0.7);
  fillLight.position.set(-4, 3, 2);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xD4AF37, 1.2);
  rimLight.position.set(0, 4, -5);
  scene.add(rimLight);

  // أرضية
  const groundGeom = new THREE.CircleGeometry(2.5, 32);
  const groundMat2 = new THREE.MeshStandardMaterial({
    color: 0x0B4F2C, emissive: 0x0B4F2C, emissiveIntensity: 0.25,
    metalness: 0.4, roughness: 0.8
  });
  const ground = new THREE.Mesh(groundGeom, groundMat2);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // مواد الملابس
  shirtMat = new THREE.MeshStandardMaterial({ color: 0x1565C0, roughness: 0.75 });
  pantsMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.8 });
  shoesMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.6 });
  hatMat = new THREE.MeshStandardMaterial({ color: 0xC62828, roughness: 0.7 });
  glassesMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.3 });
  phoneMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.3, metalness: 0.6 });

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 6;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI / 1.9;
  controls.minPolarAngle = Math.PI / 4;

  clock = new THREE.Clock();

  loadAvatar();
}

function loadAvatar() {
  const loader = new THREE.GLTFLoader();
  const modelUrl = './models/human.glb';

  loader.load(
    modelUrl,
    function(gltf) { onModelLoaded(gltf); },
    function(progress) {
      let txt = '⏳ جاري التحميل';
      if (progress.total > 0) {
        txt = '⏳ ' + Math.min(100, Math.round((progress.loaded / progress.total) * 100)) + '%';
      }
      document.getElementById('loading').innerHTML = '<div class="spinner"></div>' + txt;
    },
    function(error) {
      console.error(error);
      document.getElementById('loading').innerHTML = '❌ فشل التحميل';
    }
  );
}

function onModelLoaded(gltf) {
  avatarRoot = gltf.scene;

  avatarRoot.traverse(function(child) {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child.frustumCulled = false;
    }
  });

  // ضبط الحجم لـ 1.8m
  const box = new THREE.Box3().setFromObject(avatarRoot);
  const size = box.getSize(new THREE.Vector3());
  const targetHeight = 1.8;
  const scale = targetHeight / size.y;
  avatarRoot.scale.setScalar(scale);

  const newBox = new THREE.Box3().setFromObject(avatarRoot);
  avatarRoot.position.y = -newBox.min.y;

  scene.add(avatarRoot);

  // إضافة الملابس 3D
  addClothesToAvatar();

  // ضبط الكاميرا
  const finalBox = new THREE.Box3().setFromObject(avatarRoot);
  const center = finalBox.getCenter(new THREE.Vector3());
  const height = finalBox.max.y - finalBox.min.y;
  const dist = height * 2.0;

  camera.position.set(0, center.y + height * 0.1, dist);
  camera.lookAt(center.x, center.y, center.z);
  controls.target.set(center.x, center.y, center.z);
  controls.update();

  // Animation
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatarRoot);
    mixer.clipAction(gltf.animations[0]).play();
  }

  document.getElementById('loading').style.display = 'none';

  // نطبقو الألوان المحفوظة
  if (window.savedAvatar) {
    applyFullAvatar(window.savedAvatar);
  }
}

function addClothesToAvatar() {
  if (!avatarRoot) return;

  // نجيبو الحدود العالمية للشخصية بعد الـ scale
  const box = new THREE.Box3().setFromObject(avatarRoot);
  const minY = box.min.y;
  const maxY = box.max.y;
  const centerX = (box.min.x + box.max.x) / 2;
  const centerZ = (box.min.z + box.max.z) / 2;
  const totalH = maxY - minY;

  // المواقع النسبية
  const shoulderY = minY + totalH * 0.78;
  const chestY = minY + totalH * 0.63;
  const waistY = minY + totalH * 0.50;
  const hipY = minY + totalH * 0.42;
  const footY = minY + 0.03;

  // نصف قطر الجسم (تقريبي — 18% من الطول)
  const bodyR = totalH * 0.11;

  // ═══ القميص (من الخصر للكتفين) ═══
  const shirtH = shoulderY - waistY;
  const shirtGeom = new THREE.CylinderGeometry(bodyR * 1.05, bodyR, shirtH, 24);
  shirtMesh = new THREE.Mesh(shirtGeom, shirtMat);
  shirtMesh.position.set(centerX, (shoulderY + waistY) / 2, centerZ);
  shirtMesh.castShadow = true;
  scene.add(shirtMesh);

  // ═══ البنطال (من الخصر للركبة) ═══
  const pantsH = waistY - (minY + totalH * 0.15);
  const pantsGeom = new THREE.CylinderGeometry(bodyR, bodyR * 0.9, pantsH, 24);
  pantsMesh = new THREE.Mesh(pantsGeom, pantsMat);
  pantsMesh.position.set(centerX, waistY - pantsH / 2, centerZ);
  pantsMesh.castShadow = true;
  scene.add(pantsMesh);

  // ═══ الأكمام ═══
  const sleeveGeom = new THREE.CylinderGeometry(bodyR * 0.35, bodyR * 0.30, totalH * 0.20, 16);
  const sleeveL = new THREE.Mesh(sleeveGeom, shirtMat);
  sleeveL.position.set(centerX - bodyR * 1.2, chestY, centerZ);
  sleeveL.rotation.z = 0.15;
  sleeveL.castShadow = true;
  scene.add(sleeveL);

  const sleeveR = new THREE.Mesh(sleeveGeom, shirtMat);
  sleeveR.position.set(centerX + bodyR * 1.2, chestY, centerZ);
  sleeveR.rotation.z = -0.15;
  sleeveR.castShadow = true;
  scene.add(sleeveR);

  shirtMesh.userData.sleeves = [sleeveL, sleeveR];

  // ═══ الأحذية ═══
  const shoeGeom = new THREE.BoxGeometry(bodyR * 0.55, totalH * 0.035, totalH * 0.14);
  const shoeL = new THREE.Mesh(shoeGeom, shoesMat);
  shoeL.position.set(centerX - bodyR * 0.5, footY, centerZ + totalH * 0.02);
  shoeL.castShadow = true;
  scene.add(shoeL);

  const shoeR = new THREE.Mesh(shoeGeom, shoesMat);
  shoeR.position.set(centerX + bodyR * 0.5, footY, centerZ + totalH * 0.02);
  shoeR.castShadow = true;
  scene.add(shoeR);

  shoesMeshes = [shoeL, shoeR];

  // ═══ القبعة (مخفية) ═══
  hatMesh = new THREE.Group();
  const hatBaseGeom = new THREE.CylinderGeometry(bodyR * 0.55, bodyR * 0.55, totalH * 0.015, 24);
  const hatBase = new THREE.Mesh(hatBaseGeom, hatMat);
  hatMesh.add(hatBase);
  const hatTopGeom = new THREE.CylinderGeometry(bodyR * 0.35, bodyR * 0.4, totalH * 0.06, 24);
  const hatTop = new THREE.Mesh(hatTopGeom, hatMat);
  hatTop.position.y = totalH * 0.03;
  hatMesh.add(hatTop);
  hatMesh.position.set(centerX, maxY + totalH * 0.005, centerZ);
  hatMesh.visible = false;
  scene.add(hatMesh);

  // ═══ النظارات (مخفية) ═══
  glassesMesh = new THREE.Group();
  const frameGeom = new THREE.BoxGeometry(bodyR * 0.7, totalH * 0.012, totalH * 0.012);
  const frame = new THREE.Mesh(frameGeom, glassesMat);
  glassesMesh.add(frame);

  const lensGeom = new THREE.CircleGeometry(bodyR * 0.13, 16);
  const lensL = new THREE.Mesh(lensGeom, glassesMat);
  lensL.position.x = -bodyR * 0.2;
  glassesMesh.add(lensL);
  const lensR = new THREE.Mesh(lensGeom, glassesMat);
  lensR.position.x = bodyR * 0.2;
  glassesMesh.add(lensR);

  const headY = minY + totalH * 0.92;
  glassesMesh.position.set(centerX, headY, centerZ + bodyR * 0.85);
  glassesMesh.visible = false;
  scene.add(glassesMesh);

  // ═══ الهاتف (مخفي) ═══
  const phoneGeom = new THREE.BoxGeometry(bodyR * 0.22, totalH * 0.05, totalH * 0.008);
  phoneMesh = new THREE.Mesh(phoneGeom, phoneMat);
  phoneMesh.position.set(centerX + bodyR * 1.2, chestY - totalH * 0.15, centerZ + bodyR * 0.3);
  phoneMesh.castShadow = true;
  phoneMesh.visible = false;
  scene.add(phoneMesh);
}

// تطبيق الألوان
window.setShirtColor = function(hex) {
  shirtMat.color.set(hex);
};

window.setPantsColor = function(hex) {
  pantsMat.color.set(hex);
};

window.setSkinColor = function(hex) {
  if (!avatarRoot) return;
  // نغيرو لون النموذج الأصلي فقط (avatarRoot ما فيهش ملابس بعد الفصل)
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material && child.material.color) {
      child.material.color.set(hex);
    }
  });
};

window.setShoesColor = function(hex) {
  shoesMat.color.set(hex);
};

window.setHatColor = function(hex) {
  hatMat.color.set(hex);
};

window.setGlassesColor = function(hex) {
  glassesMat.color.set(hex);
};

window.setHatVisible = function(v) { if (hatMesh) hatMesh.visible = v; };
window.setGlassesVisible = function(v) { if (glassesMesh) glassesMesh.visible = v; };
window.setPhoneVisible = function(v) { if (phoneMesh) phoneMesh.visible = v; };

window.applyFullAvatar = function(data) {
  window.savedAvatar = data;
  if (data.skin) window.setSkinColor(data.skin);
  if (data.shirt) window.setShirtColor(data.shirt);
  if (data.pants) window.setPantsColor(data.pants);
  if (data.shoes) window.setShoesColor(data.shoes);
  if (data.hat) window.setHatColor(data.hat);
  if (data.glasses) window.setGlassesColor(data.glasses);
  window.setHatVisible(data.hatVisible === true);
  window.setGlassesVisible(data.glassesVisible === true);
  window.setPhoneVisible(data.phoneVisible === true);
};

window.applyColors = window.applyFullAvatar;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
