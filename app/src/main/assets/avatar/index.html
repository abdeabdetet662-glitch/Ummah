<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avatar 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #0B4F2C 0%, #0A0A0A 70%); }
  canvas { display: block; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #D4AF37; font-family: sans-serif; font-size: 18px;
    text-align: center; z-index: 10;
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2);
    border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  ⏳ جاري التحميل
</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/GLTFLoader.js"></script>
<script src="./libs/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls;
let avatarRoot = null;
let mixer = null;
let clock;

// نحفظو المواد الأصلية
let allMats = [];

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // إضاءة
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
  keyLight.position.set(3, 6, 4);
  keyLight.castShadow = true;
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
  fillLight.position.set(-4, 3, 2);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xFFD97A, 2.0);
  rimLight.position.set(0, 4, -5);
  scene.add(rimLight);

  // أرضية
  const groundGeom = new THREE.CircleGeometry(2.5, 32);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0B4F2C, emissive: 0x0B4F2C, emissiveIntensity: 0.3,
    metalness: 0.4, roughness: 0.7
  });
  const ground = new THREE.Mesh(groundGeom, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 6;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI / 1.9;
  controls.minPolarAngle = Math.PI / 4;

  clock = new THREE.Clock();
  loadAvatar();
}

function loadAvatar() {
  const loader = new THREE.GLTFLoader();
  loader.load(
    './models/human.glb',
    function(gltf) { onModelLoaded(gltf); },
    function(progress) {
      let txt = '⏳ جاري التحميل';
      if (progress.total > 0) {
        txt = '⏳ ' + Math.min(100, Math.round((progress.loaded / progress.total) * 100)) + '%';
      }
      document.getElementById('loading').innerHTML = '<div class="spinner"></div>' + txt;
    },
    function(error) {
      console.error(error);
      document.getElementById('loading').innerHTML = '❌ فشل التحميل';
    }
  );
}

function onModelLoaded(gltf) {
  avatarRoot = gltf.scene;

  // نجمعو المواد
  avatarRoot.traverse(function(child) {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child.frustumCulled = false;

      if (child.material) {
        // نصنعو نسخة معدلة من كل material
        if (Array.isArray(child.material)) {
          child.material = child.material.map(m => m.clone());
          child.material.forEach(m => {
            m.userData.name = (m.name || '').toLowerCase();
            allMats.push(m);
          });
        } else {
          child.material = child.material.clone();
          child.material.userData.name = (child.material.name || '').toLowerCase();
          allMats.push(child.material);
        }
      }
    }
  });

  // Animation
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatarRoot);
    mixer.clipAction(gltf.animations[0]).play();
  }

  // ضبط الحجم
  const box = new THREE.Box3().setFromObject(avatarRoot);
  const size = box.getSize(new THREE.Vector3());
  const targetHeight = 1.75;
  const scale = targetHeight / size.y;
  avatarRoot.scale.setScalar(scale);

  const newBox = new THREE.Box3().setFromObject(avatarRoot);
  avatarRoot.position.y = -newBox.min.y;

  scene.add(avatarRoot);

  // ضبط الكاميرا
  const finalBox = new THREE.Box3().setFromObject(avatarRoot);
  const center = finalBox.getCenter(new THREE.Vector3());
  const height = finalBox.max.y - finalBox.min.y;
  const dist = height * 2.2;

  camera.position.set(0, center.y + height * 0.1, dist);
  camera.lookAt(center.x, center.y, center.z);
  controls.target.set(center.x, center.y, center.z);
  controls.update();

  document.getElementById('loading').style.display = 'none';

  if (window.savedAvatar) applyFullAvatar(window.savedAvatar);
}

// ═══ تغيير الألوان — نستهدف المواد حسب موقعها ═══
// CesiumMan عادة عندو مادة واحدة أو مواد حسب الـ mesh

window.setShirtColor = function(hex) {
  if (!avatarRoot) return;
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => {
        // نغيرو فقط المواد اللي فيها "CesiumMan" أو "Torso"
        if (m.color) m.color.set(hex);
      });
    }
  });
};

window.setPantsColor = function(hex) {
  // CesiumMan ما عندوش بنطال منفصل — نفس الشي
  // نستعملو نصف الجسم الأسفل (لكن صعب نفرق)
};

window.setSkinColor = function(hex) {};

window.setShoesColor = function(hex) {};

window.setHatColor = function(hex) {};
window.setGlassesColor = function(hex) {};
window.setHatVisible = function(v) {};
window.setGlassesVisible = function(v) {};
window.setPhoneVisible = function(v) {};

window.applyFullAvatar = function(data) {
  window.savedAvatar = data;
  if (data.shirt) window.setShirtColor(data.shirt);
};

window.applyColors = window.applyFullAvatar;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
