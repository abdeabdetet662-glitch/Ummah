<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avatar 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #0B4F2C 0%, #0A0A0A 70%); }
  canvas { display: block; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #D4AF37; font-family: sans-serif; font-size: 18px;
    text-align: center; z-index: 10;
  }
  .spinner {
    border: 4px solid rgba(212, 175, 55, 0.2);
    border-top: 4px solid #D4AF37;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  ⏳ جاري التحميل
</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/GLTFLoader.js"></script>
<script src="./libs/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls;
let avatarRoot = null;
let mixer = null;
let clock;

// ملابس 3D
let shirtMesh = null;
let pantsMesh = null;
let hatMesh = null;
let glassesMesh = null;
let phoneMesh = null;
let shoesMeshes = [];

let hatVisible = false;
let glassesVisible = false;
let phoneVisible = false;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const keyLight = new THREE.DirectionalLight(0xFFD97A, 2.2);
  keyLight.position.set(3, 6, 4);
  keyLight.castShadow = true;
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x4A90E2, 0.8);
  fillLight.position.set(-4, 3, 2);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xD4AF37, 1.2);
  rimLight.position.set(0, 4, -5);
  scene.add(rimLight);

  const groundGeom = new THREE.CircleGeometry(2.5, 32);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0B4F2C, emissive: 0x0B4F2C, emissiveIntensity: 0.2,
    metalness: 0.4, roughness: 0.8
  });
  const ground = new THREE.Mesh(groundGeom, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 6;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI / 1.9;
  controls.minPolarAngle = Math.PI / 4;

  clock = new THREE.Clock();
  loadAvatar();
}

function loadAvatar() {
  const loader = new THREE.GLTFLoader();
  const modelUrl = './models/xbot.glb';

  loader.load(
    modelUrl,
    function(gltf) { onModelLoaded(gltf); },
    function(progress) {
      let txt = '⏳ جاري التحميل';
      if (progress.total > 0) {
        txt = '⏳ ' + Math.min(100, Math.round((progress.loaded / progress.total) * 100)) + '%';
      }
      document.getElementById('loading').innerHTML = '<div class="spinner"></div>' + txt;
    },
    function(error) {
      console.warn('Xbot فشل، نجربو Soldier...');
      loader.load('./models/soldier.glb',
        function(gltf) { onModelLoaded(gltf); },
        null,
        function(err) {
          document.getElementById('loading').innerHTML = '❌ فشل التحميل';
        });
    }
  );
}

function onModelLoaded(gltf) {
  avatarRoot = gltf.scene;

  avatarRoot.traverse(function(child) {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      if (child.material && child.material.color) {
        child.material.color.set('#E8B98A');
      }
    }
  });

  const box = new THREE.Box3().setFromObject(avatarRoot);
  const size = box.getSize(new THREE.Vector3());
  const targetHeight = 1.8;
  const scale = targetHeight / size.y;
  avatarRoot.scale.setScalar(scale);

  const newBox = new THREE.Box3().setFromObject(avatarRoot);
  avatarRoot.position.y = -newBox.min.y;

  scene.add(avatarRoot);

  addClothesToAvatar();

  const finalBox = new THREE.Box3().setFromObject(avatarRoot);
  const center = finalBox.getCenter(new THREE.Vector3());
  const height = finalBox.max.y - finalBox.min.y;
  const dist = height * 2.2;

  camera.position.set(0, center.y + height * 0.15, dist);
  camera.lookAt(center.x, center.y, center.z);
  controls.target.set(center.x, center.y, center.z);
  controls.update();

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatarRoot);
    let idle = null;
    for (let i = 0; i < gltf.animations.length; i++) {
      if (gltf.animations[i].name.toLowerCase().indexOf('idle') >= 0) {
        idle = gltf.animations[i];
        break;
      }
    }
    if (!idle) idle = gltf.animations[0];
    if (idle) mixer.clipAction(idle).play();
  }

  document.getElementById('loading').style.display = 'none';

  // نطبقو اللي محفوظ
  if (window.savedAvatar) {
    applyFullAvatar(window.savedAvatar);
  }
}

function addClothesToAvatar() {
  if (!avatarRoot) return;

  // القميص
  const shirtGeom = new THREE.CylinderGeometry(0.34, 0.32, 0.70, 24);
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1565C0, roughness: 0.7 });
  shirtMesh = new THREE.Mesh(shirtGeom, shirtMat);
  shirtMesh.position.y = 1.00;
  shirtMesh.castShadow = true;
  avatarRoot.add(shirtMesh);

  // البنطال
  const pantsGeom = new THREE.CylinderGeometry(0.32, 0.30, 0.60, 24);
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.8 });
  pantsMesh = new THREE.Mesh(pantsGeom, pantsMat);
  pantsMesh.position.y = 0.60;
  pantsMesh.castShadow = true;
  avatarRoot.add(pantsMesh);

  // القبعة
  const hatGeom = new THREE.ConeGeometry(0.24, 0.22, 24);
  const hatMat = new THREE.MeshStandardMaterial({ color: 0xC62828, roughness: 0.7 });
  hatMesh = new THREE.Mesh(hatGeom, hatMat);
  hatMesh.position.y = 1.98;
  hatMesh.castShadow = true;
  hatMesh.visible = false;
  avatarRoot.add(hatMesh);

  // النظارات
  const glassesGeom = new THREE.BoxGeometry(0.34, 0.06, 0.06);
  const glassesMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.3 });
  glassesMesh = new THREE.Mesh(glassesGeom, glassesMat);
  glassesMesh.position.set(0, 1.72, 0.22);
  glassesMesh.castShadow = true;
  glassesMesh.visible = false;
  avatarRoot.add(glassesMesh);

  // الهاتف (في اليد اليمنى)
  const phoneGeom = new THREE.BoxGeometry(0.10, 0.18, 0.02);
  const phoneMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.3, metalness: 0.5 });
  phoneMesh = new THREE.Mesh(phoneGeom, phoneMat);
  phoneMesh.position.set(0.42, 0.95, 0.15);
  phoneMesh.castShadow = true;
  phoneMesh.visible = false;
  avatarRoot.add(phoneMesh);

  // الأحذية
  const shoeGeom = new THREE.BoxGeometry(0.16, 0.10, 0.28);
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.6 });

  const shoeL = new THREE.Mesh(shoeGeom, shoeMat);
  shoeL.position.set(-0.14, 0.05, 0.05);
  shoeL.castShadow = true;
  avatarRoot.add(shoeL);

  const shoeR = new THREE.Mesh(shoeGeom, shoeMat);
  shoeR.position.set(0.14, 0.05, 0.05);
  shoeR.castShadow = true;
  avatarRoot.add(shoeR);

  shoesMeshes = [shoeL, shoeR];

  // أكمام القميص
  const sleeveGeom = new THREE.CylinderGeometry(0.11, 0.10, 0.40, 16);
  const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x1565C0, roughness: 0.7 });

  const sleeveL = new THREE.Mesh(sleeveGeom, sleeveMat);
  sleeveL.position.set(-0.35, 1.05, 0);
  sleeveL.castShadow = true;
  avatarRoot.add(sleeveL);

  const sleeveR = new THREE.Mesh(sleeveGeom, sleeveMat);
  sleeveR.position.set(0.35, 1.05, 0);
  sleeveR.castShadow = true;
  avatarRoot.add(sleeveR);

  shirtMesh.userData.sleeves = [sleeveL, sleeveR];
}

// ═══ تغيير لون القميص ═══
window.setShirtColor = function(hex) {
  if (!shirtMesh) return;
  shirtMesh.material.color.set(hex);
  if (shirtMesh.userData.sleeves) {
    shirtMesh.userData.sleeves.forEach(function(s) {
      s.material.color.set(hex);
    });
  }
};

// ═══ تغيير لون البنطال ═══
window.setPantsColor = function(hex) {
  if (pantsMesh) pantsMesh.material.color.set(hex);
};

// ═══ تغيير لون البشرة ═══
window.setSkinColor = function(hex) {
  if (!avatarRoot) return;
  avatarRoot.traverse(function(child) {
    if (child.isMesh && child.material && child !== shirtMesh && child !== pantsMesh
        && child !== hatMesh && child !== glassesMesh && child !== phoneMesh
        && shoesMeshes.indexOf(child) < 0
        && (!shirtMesh.userData.sleeves || shirtMesh.userData.sleeves.indexOf(child) < 0)) {
      if (child.material.color) child.material.color.set(hex);
    }
  });
};

// ═══ تغيير لون الأحذية ═══
window.setShoesColor = function(hex) {
  shoesMeshes.forEach(function(s) { s.material.color.set(hex); });
};

// ═══ تغيير لون القبعة ═══
window.setHatColor = function(hex) {
  if (hatMesh) hatMesh.material.color.set(hex);
};

// ═══ تغيير لون النظارات ═══
window.setGlassesColor = function(hex) {
  if (glassesMesh) glassesMesh.material.color.set(hex);
};

// ═══ إظهار/إخفاء ═══
window.setHatVisible = function(v) { if (hatMesh) hatMesh.visible = v; };
window.setGlassesVisible = function(v) { if (glassesMesh) glassesMesh.visible = v; };
window.setPhoneVisible = function(v) { if (phoneMesh) phoneMesh.visible = v; };

// ═══ تطبيق كل شي من Java ═══
window.applyFullAvatar = function(data) {
  window.savedAvatar = data;
  if (data.skin) window.setSkinColor(data.skin);
  if (data.shirt) window.setShirtColor(data.shirt);
  if (data.pants) window.setPantsColor(data.pants);
  if (data.shoes) window.setShoesColor(data.shoes);
  if (data.hat) window.setHatColor(data.hat);
  if (data.glasses) window.setGlassesColor(data.glasses);
  window.setHatVisible(data.hatVisible === true);
  window.setGlassesVisible(data.glassesVisible === true);
  window.setPhoneVisible(data.phoneVisible === true);
};

// القديمة (توافق)
window.applyColors = window.applyFullAvatar;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
